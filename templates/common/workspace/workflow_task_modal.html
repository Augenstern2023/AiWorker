<div class="modal fade" id="workflowTaskModal" tabindex="-1" aria-labelledby="workflowTaskModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title fs-5" id="workflowTaskModalTitle" x-text="`${stageWorkflowAssignmentLabel(workflowTaskWindow.task)}任务安排`">任务安排</h2>
                    <div class="small text-muted" x-show="workflowTaskWindow.task" x-text="`项目 ${workflowTaskWindow.task?.project_id || '-'}`"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="text-center text-muted py-4" x-show="workflowTaskWindow.loading">
                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>正在读取任务
                </div>
                <div class="alert alert-danger" x-show="workflowTaskWindow.error" x-text="workflowTaskWindow.error"></div>
                <template x-if="workflowTaskWindow.task && !workflowTaskWindow.loading">
                    <div>
                        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                            <div><div class="small text-muted">任务类型</div><div class="fw-semibold" x-text="stageWorkflowAssignmentLabel(workflowTaskWindow.task)"></div></div>
                            <span class="badge bg-secondary" x-text="workflowTaskStatusLabel(workflowTaskWindow.task.status)"></span>
                        </div>
                        <div x-show="workflowTaskWindow.task.status === 'pool'">
                            <div class="mb-3" x-show="workflowTaskWindow.task.can_claim">
                                <div class="small text-muted mb-2">由当前账号负责该项目</div>
                                <button class="btn btn-primary w-100" type="button" @click="claimWorkflowTask(workflowTaskWindow.task)" :disabled="workflowTaskWindow.saving">
                                    <i class="bi bi-person-check me-1"></i>领取任务
                                </button>
                            </div>
                            <div class="border-top pt-3" x-show="workflowTaskWindow.task.can_assign">
                                <label class="form-label" for="workflow-task-assignee" x-text="`分配给${workflowTaskRoleLabel(workflowTaskWindow.task)}`"></label>
                                <select class="form-select mb-2" id="workflow-task-assignee" x-model="workflowTaskWindow.selectedAssigneeId" :disabled="workflowTaskWindow.saving || !workflowTaskWindow.candidates.length">
                                    <option value="">选择用户</option>
                                    <template x-for="candidate in workflowTaskWindow.candidates" :key="candidate.user_id">
                                        <option :value="candidate.user_id" x-text="`${candidate.display_name}（${candidate.username}）${candidate.is_project_member ? '' : ' · 将加入项目'}`"></option>
                                    </template>
                                </select>
                                <button class="btn btn-outline-primary w-100" type="button" @click="assignWorkflowTask" :disabled="workflowTaskWindow.saving || !workflowTaskWindow.selectedAssigneeId">
                                    <i class="bi bi-person-plus me-1"></i>分配任务
                                </button>
                                <div class="small text-muted mt-2" x-show="!workflowTaskWindow.candidates.length">暂无符合该任务角色的启用用户。</div>
                            </div>
                            <div class="alert alert-light border mb-0" x-show="!workflowTaskWindow.task.can_claim && !workflowTaskWindow.task.can_assign" x-text="`等待${workflowTaskRoleLabel(workflowTaskWindow.task)}领取，或由项目负责人分配。`"></div>
                        </div>
                        <div x-show="workflowTaskWindow.task.status !== 'pool'">
                            <div class="small text-muted mb-3" x-text="workflowTaskWindow.task.assignee_user_id ? `负责人：${workflowTaskWindow.task.assignee_user_id}` : '任务尚未分配'"></div>
                            <button class="btn btn-primary w-100" type="button" x-show="workflowTaskWindow.task.can_start" @click="startWorkflowTaskFromWindow" :disabled="workflowTaskWindow.saving">
                                <i class="bi bi-play-fill me-1"></i>开始任务
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
