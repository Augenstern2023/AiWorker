<div class="workspace-stage-editor workspace-stage-editor--brief workspace-editor-pane">
<div class="d-flex justify-content-between align-items-center gap-2 mb-3" x-show="isFreeCreativeProject()" x-cloak>
    <div><h5 class="mb-1">自由 Brief</h5><div class="small text-muted">直接创建，或仅使用项目种子与显式选择的锁定资源生成。</div></div>
    <div class="d-flex gap-2"><button class="btn btn-primary btn-sm" @click="generateProjectBlueprints" :disabled="creativeActionDisabled('blueprints') || !freeStageCan('brief', 'can_generate')"><i class="bi bi-stars me-1"></i>AI 生成</button><button class="btn btn-outline-light btn-sm" @click="createFreeBlankResource('brief')" :disabled="!freeStageCan('brief', 'can_create_blank')"><i class="bi bi-plus-lg me-1"></i>空白版本</button></div>
</div>
<section class="workspace-section" aria-labelledby="brief-directions-heading">
    <div class="workspace-section__header"><h6 id="brief-directions-heading">方向候选</h6><span class="small text-muted">先比较核心命题，再进入下方编辑器</span></div>
    <div class="workspace-card-grid">
        <template x-for="item in latestProjectBlueprints()" :key="`brief-card-${item.id}`">
            <article class="workspace-card workspace-blueprint-card" :class="{'is-selected': creativeWorkspace.selectedBlueprintId === item.id}">
                <div class="workspace-card__header">
                    <div class="d-flex align-items-start gap-2 min-w-0"><input class="form-check-input mt-1" type="checkbox" :checked="creativeWorkspace.preservedBlueprintIds.includes(item.id)" :disabled="item.status !== 'draft'" @change="togglePreservedBlueprint(item.id, $event.target.checked)" :aria-label="`保留${item.content.title || '方向'}`"><div class="min-w-0"><div class="workspace-card__title" x-text="item.content.title || '未命名方向'"></div><div class="workspace-card__meta" x-text="`v${item.version} · ${creativeWorkflowStatusLabel(item.status)}`"></div></div></div>
                    <button class="btn btn-sm btn-outline-light" type="button" @click="openProjectBlueprintEditor(item.id)" :aria-label="`编辑方向：${item.content.title || '未命名方向'}`" title="编辑方向"><i class="bi bi-pencil" aria-hidden="true"></i></button>
                </div>
                <div class="workspace-field-grid workspace-blueprint-summary">
                    <div class="workspace-featured-field"><span>核心命题</span><p class="workspace-prose mb-0" x-text="item.content.theme || item.content.background || '-' "></p></div>
                    <div><span class="workspace-field-label">主角</span><p class="workspace-prose mb-0" x-text="item.content.protagonist || '-' "></p></div>
                    <div><span class="workspace-field-label">核心冲突</span><p class="workspace-prose mb-0" x-text="item.content.core_conflict || '-' "></p></div>
                    <div><span class="workspace-field-label">差异化卖点</span><p class="workspace-prose mb-0" x-text="listText(item.content.differentiators) || imitationReason(item.content) || '-' "></p></div>
                    <div class="workspace-card__meta"><span>成本</span><strong x-text="item.content.cost_level || '-' "></strong></div>
                    <div class="workspace-card__meta"><span>风险</span><strong x-text="`${riskLabel(item.risk_level)} ${Number(item.risk_score || 0).toFixed(0)}`"></strong></div>
                </div>
            </article>
        </template>
        <div class="workspace-empty" x-show="!latestProjectBlueprints().length"><div><div class="workspace-state__title">尚未生成方向</div><div class="small">使用上方生成入口创建方向候选。</div></div></div>
    </div>
</section>
<template x-if="creativeWorkspace.project?.creation_mode === 'original'"><div class="original-brief-workspace">
    <div class="d-flex justify-content-between align-items-end gap-3 mb-3 original-direction-toolbar" x-show="!isFreeCreativeProject()">
        <div><h5 class="mb-1">原创方向与 Brief</h5><div class="small text-muted">从冻结的灵感版本发散；市场参考只提供安全的市场信号。</div></div>
        <div class="d-flex flex-wrap gap-2 align-items-end original-direction-actions"><div><label class="form-label small">目标方向数</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.directionCount"><option :value="3">3</option><option :value="4">4</option><option :value="5">5</option></select></div><button class="btn btn-primary btn-sm" @click="generateProjectBlueprints" :disabled="creativeActionDisabled('blueprints')"><i class="bi bi-stars me-1"></i><span x-text="latestProjectBlueprints().length ? '补足方向' : '生成原创方向'"></span></button></div>
    </div>
    <div class="original-seed-editor mb-3" x-show="creativeWorkspace.project?.seed"><label class="form-label small">当前灵感版本 <span class="text-muted" x-text="`v${creativeWorkspace.project.seed.version} · ${creativeWorkspace.project.seed.status === 'frozen' ? '已冻结' : '草稿'}`"></span></label><div class="input-group"><textarea class="form-control form-control-sm workspace-prose-editor" rows="2" maxlength="500" x-model="creativeWorkspace.project.seed.seed_text"></textarea><button class="btn btn-outline-light" type="button" @click="saveOriginalSeed" title="冻结版本会另存为新版本"><i class="bi bi-save"></i></button></div></div>
    <div class="table-responsive original-direction-grid creative-direction-grid d-none" aria-hidden="true"><table class="table table-sm align-middle creative-direction-table creative-direction-table-original"><colgroup><col class="col-direction-preserve"><col class="col-direction-title"><col class="col-direction-detail"><col class="col-direction-detail"><col class="col-direction-detail"><col class="col-direction-detail"><col class="col-direction-detail"><col class="col-direction-detail"><col class="col-direction-action"></colgroup><thead><tr><th>保留</th><th>方向</th><th>核心命题</th><th>主角</th><th>核心冲突</th><th>差异化卖点</th><th>成本</th><th>创作风险</th><th>操作</th></tr></thead><tbody><template x-for="item in latestProjectBlueprints()" :key="item.id"><tr :class="{'table-active': creativeWorkspace.selectedBlueprintId === item.id}"><td data-label="保留"><input class="form-check-input" type="checkbox" :checked="creativeWorkspace.preservedBlueprintIds.includes(item.id)" :disabled="item.status !== 'draft'" @change="togglePreservedBlueprint(item.id, $event.target.checked)" :aria-label="`保留${item.content.title || '方向'}`"></td><td data-label="方向" class="fw-semibold" x-text="item.content.title || '未命名方向'"></td><td data-label="核心命题" x-text="item.content.theme || '-'"></td><td data-label="主角" x-text="item.content.protagonist || '-'"></td><td data-label="核心冲突" x-text="item.content.core_conflict || '-'"></td><td data-label="差异化卖点" x-text="listText(item.content.differentiators) || '-'"></td><td data-label="成本" x-text="item.content.cost_level || '-'"></td><td data-label="创作风险" x-text="listText(item.content.risks) || '-'"></td><td data-label="操作" class="direction-action-cell"><button class="btn btn-sm btn-outline-light" type="button" @click="openProjectBlueprintEditor(item.id)" :aria-label="`编辑方向：${item.content.title || '未命名方向'}`" title="编辑方向">编辑</button></td></tr></template><tr x-show="!latestProjectBlueprints().length"><td colspan="9" class="text-center text-muted py-4">尚未生成原创方向</td></tr></tbody></table></div>
    <template x-if="selectedProjectBlueprint()"><div class="border-top pt-3 original-direction-editor workspace-editor-pane workspace-section" data-creative-blueprint-editor>
        <div class="workspace-section__header"><div><div class="workspace-section-label">Command</div><h6 class="mb-1">编辑原创 Brief</h6></div><span class="small text-muted">选中方向后编辑、保存或锁定</span></div>
        <div class="small text-muted mb-2" data-template-provenance x-text="creativeTemplateProvenance(selectedProjectBlueprint())"></div>
        <aside class="workspace-inspector mb-3" aria-label="原创 Brief Inspect"><div class="workspace-inspector__header"><div><div class="workspace-section-label">Inspect</div><strong>版本状态</strong></div><i class="bi bi-file-earmark-text text-info" aria-hidden="true"></i></div><div class="workspace-inspector__body d-flex flex-wrap gap-3 align-items-center"><div><div class="small text-muted">当前版本</div><strong x-text="`v${selectedProjectBlueprint().version}`"></strong></div><div class="small text-muted" x-text="creativeWorkflowStatusLabel(selectedProjectBlueprint().status)"></div><div class="small text-muted" x-show="!creativeResourceEditable(selectedProjectBlueprint())"><i class="bi bi-lock me-1" aria-hidden="true"></i>已锁定，只读；请基于此版本新建。</div><div class="small text-success" x-show="creativeResourceEditable(selectedProjectBlueprint())"><i class="bi bi-pencil me-1" aria-hidden="true"></i>可编辑草稿</div></div></aside>
        <section class="border-bottom pb-3 mb-3" aria-labelledby="original-project-settings-heading">
            <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
                <h6 id="original-project-settings-heading" class="mb-0">项目参数</h6>
                <span class="small text-muted">用于后续大纲、Beats 与正文生成</span>
            </div>
            <div class="row g-2 align-items-end">
                <div class="col-lg-3 col-md-6"><label class="form-label small" for="original-brief-project-name">项目名称</label><input id="original-brief-project-name" class="form-control form-control-sm" x-model="creativeWorkspace.project.name" disabled></div>
                <div class="col-lg-3 col-md-6"><label class="form-label small" for="original-brief-genre">题材</label><input id="original-brief-genre" class="form-control form-control-sm" x-model="creativeWorkspace.project.genre" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
                <div class="col-lg-3 col-md-6"><label class="form-label small" for="original-brief-platform">目标平台/载体</label><input id="original-brief-platform" class="form-control form-control-sm" x-model="creativeWorkspace.project.target_platform" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
                <div class="col-lg-3 col-md-6"><label class="form-label small" for="original-brief-audience">目标受众</label><textarea id="original-brief-audience" class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(creativeWorkspace.project.target_audience, 16)" x-model="creativeWorkspace.project.target_audience" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                <div class="col-lg-3 col-md-4"><label class="form-label small" for="original-brief-episode-count">目标集数/章数</label><input id="original-brief-episode-count" class="form-control form-control-sm" type="number" min="1" max="100" x-model.number="creativeWorkspace.project.target_episode_count" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
                <div class="col-lg-3 col-md-4"><label class="form-label small" for="original-brief-duration">单集/章时长（秒）</label><input id="original-brief-duration" class="form-control form-control-sm" type="number" min="30" max="1800" x-model.number="creativeWorkspace.project.episode_duration_seconds" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
                <div class="col-lg-3 col-md-4 d-grid"><button class="btn btn-outline-light btn-sm" type="button" @click="saveCreativeProjectSettings" :disabled="!creativeResourceEditable(selectedProjectBlueprint())" title="保存任务书参数" aria-label="保存任务书参数"><i class="bi bi-save me-1" aria-hidden="true"></i>保存项目参数</button></div>
            </div>
            <div class="alert alert-info py-2 small mt-3 mb-0" x-show="!creativeResourceEditable(selectedProjectBlueprint())" role="status">
                <i class="bi bi-lock me-1" aria-hidden="true"></i>当前 Brief 已锁定，项目参数随本版本只读展示。如需修改请基于此版本新建。
            </div>
        </section>
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label small">方向名称</label><input class="form-control form-control-sm" x-model="selectedProjectBlueprint().content.title" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
            <div class="col-md-4"><label class="form-label small">主角</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(selectedProjectBlueprint().content.protagonist, 24)" x-model="selectedProjectBlueprint().content.protagonist" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-4"><label class="form-label small">核心冲突</label><textarea class="form-control form-control-sm" rows="2" x-model="selectedProjectBlueprint().content.core_conflict" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-6"><label class="form-label small">一句话梗概</label><textarea class="form-control form-control-sm workspace-prose-editor" rows="3" x-model="selectedProjectBlueprint().content.logline" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-6"><label class="form-label small">核心命题</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.theme" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-6"><label class="form-label small">故事发动机</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.story_engine" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-6"><label class="form-label small">差异化卖点</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.differentiators)" @input="setListField(selectedProjectBlueprint().content, 'differentiators', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-12"><label class="form-label small">原创性说明</label><textarea class="form-control form-control-sm" rows="2" x-model="selectedProjectBlueprint().content.originality_statement" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-4"><label class="form-label small">创作风险</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.risks)" @input="setListField(selectedProjectBlueprint().content, 'risks', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-4"><label class="form-label small">当前假设</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.assumptions)" @input="setListField(selectedProjectBlueprint().content, 'assumptions', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-4"><label class="form-label small">待确认问题</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.open_questions)" @input="setListField(selectedProjectBlueprint().content, 'open_questions', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3 original-direction-actions workspace-sticky-actions"><button class="btn btn-outline-light btn-sm" @click="saveProjectBlueprint" :disabled="!creativeResourceEditable(selectedProjectBlueprint())">保存草稿</button><button class="btn btn-warning btn-sm" @click="completeProjectBrief" :disabled="!creativeResourceEditable(selectedProjectBlueprint())">完成并锁定</button><button class="btn btn-outline-info btn-sm" x-show="['brief_locked', 'locked', 'approved'].includes(selectedProjectBlueprint().status) && (!isFreeCreativeProject() || String(selectedProjectBlueprint().id) === freeStageHeadRef('brief'))" @click="createProjectBlueprintVersion" :disabled="isFreeCreativeProject() && !freeStageCan('brief', 'can_create_revision')"><i class="bi bi-files me-1" aria-hidden="true"></i><span x-text="isFreeCreativeProject() ? '创建修订版' : '基于此版本新建'"></span></button><input class="form-control form-control-sm variant-instruction" maxlength="500" x-model="creativeWorkspace.variantInstruction" placeholder="填写派生要求，如：改成悬疑类型"><button class="btn btn-outline-info btn-sm" @click="deriveOriginalDirection" :disabled="!creativeWorkspace.variantInstruction.trim()">派生方向</button></div>
    </div>
    </template>
</div>
</template>
<template x-if="creativeWorkspace.project?.creation_mode !== 'original'"><div class="imitation-brief-workspace">
                    <div class="d-flex justify-content-between align-items-end mb-3" x-show="!isFreeCreativeProject()"><div><template x-if="creativeWorkspace.project?.creation_mode !== 'original'"><h5 class="mb-1">仿制方向与 Brief</h5></template><div class="small text-muted">只借鉴结构和爽点，不复制剧情、人设、台词或具体表达</div></div><div class="d-flex flex-wrap gap-2 align-items-end"><div><label class="form-label small">方向数量</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.directionCount"><option :value="3">3</option><option :value="4">4</option><option :value="5">5</option></select></div><button class="btn btn-primary btn-sm" @click="generateProjectBlueprints" :disabled="creativeActionDisabled('blueprints')"><span class="spinner-border spinner-border-sm me-1" x-show="creativeActionRunning('blueprints')"></span><i class="bi bi-stars me-1" x-show="!creativeActionRunning('blueprints')"></i><span x-text="creativeActionRunning('blueprints') ? (creativeWorkspace.startingAction === 'blueprints' ? '正在启动' : '生成中') : '生成方向'"></span></button></div></div>

n-cell"><button class="btn btn-sm btn-outline-light" type="button" @click="openProjectBlueprintEditor(item.id)" :aria-label="`编辑方向：${item.content.title || '未命名方向'}`" title="编辑方向"><i class="bi bi-pencil" aria-hidden="true"></i></button></td></tr></template><tr x-show="!latestProjectBlueprints().length"><td colspan="10" class="text-center text-muted py-4">尚未生成仿制方向</td></tr></tbody></table></div>
                     <template x-if="selectedProjectBlueprint()"><div class="border-top pt-3 workspace-editor-pane workspace-section" data-creative-blueprint-editor>
                         <div class="workspace-section__header"><div><div class="workspace-section-label">Command</div><h6 class="mb-1">编辑仿制 Brief</h6></div><span class="small text-muted">选中方向后编辑、保存或锁定</span></div>

                            <div class="creative-project-settings-grid">
                                <div class="creative-project-setting-name"><label class="form-label small">项目名称</label><input class="form-control form-control-sm" x-model="creativeWorkspace.project.name" :disabled="true"></div>
                                <div class="creative-project-setting-genre"><label class="form-label small">题材</label><input class="form-control form-control-sm" x-model="creativeWorkspace.project.genre" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>

                        </section>
                        <div class="alert alert-info py-2 small mb-3" x-show="!creativeResourceEditable(selectedProjectBlueprint())" role="status">
                            <i class="bi bi-lock me-1" aria-hidden="true"></i>此版本已锁定，不可编辑。如需修改请创建新版本。
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4"><label class="form-label small">方向名称</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.selectedBlueprintId"><template x-for="item in latestProjectBlueprints()" :key="`direction-${item.id}`"><option :value="item.id" x-text="item.content.title || `方向 v${item.version}`"></option></template></select></div>
                            <div class="col-md-4"><label class="form-label small">新主角</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(selectedProjectBlueprint().content.protagonist, 24)" x-model="selectedProjectBlueprint().content.protagonist" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-4"><label class="form-label small">核心冲突</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(selectedProjectBlueprint().content.core_conflict, 24)" x-model="selectedProjectBlueprint().content.core_conflict" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">新背景</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(selectedProjectBlueprint().content.background, 24)" x-model="selectedProjectBlueprint().content.background" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">方向目标受众</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(selectedProjectBlueprint().content.audience, 24)" x-model="selectedProjectBlueprint().content.audience" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-12"><label class="form-label small">仿制原因</label><textarea class="form-control form-control-sm" :rows="textareaRows(imitationReason(selectedProjectBlueprint().content), 70)" :value="imitationReason(selectedProjectBlueprint().content)" @input="setImitationReason(selectedProjectBlueprint().content, $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">主线目标</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.main_goal" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">世界观</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.worldview" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">借鉴元素</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.borrowed_elements)" @input="setListField(selectedProjectBlueprint().content, 'borrowed_elements', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">必须差异化元素</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.different_elements)" @input="setListField(selectedProjectBlueprint().content, 'different_elements', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">前三集钩子</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.first_three_hooks)" @input="setListField(selectedProjectBlueprint().content, 'first_three_hooks', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">整体爽点</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.highlights)" @input="setListField(selectedProjectBlueprint().content, 'highlights', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-12"><label class="form-label small">差异化修改说明 <span class="text-warning" x-show="selectedProjectBlueprint().risk_level === 'high'">高风险方向完成锁定前必填</span></label><textarea class="form-control form-control-sm" rows="2" x-model="selectedProjectBlueprint().difference_note" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mt-3 workspace-sticky-actions"><button class="btn btn-outline-light btn-sm" @click="saveProjectBlueprint" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"><i class="bi bi-save me-1"></i>保存草稿</button><button class="btn btn-warning btn-sm" @click="completeProjectBrief" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"><i class="bi bi-lock-fill me-1"></i>完成并锁定</button><button class="btn btn-outline-info btn-sm" x-show="['brief_locked', 'locked', 'approved'].includes(selectedProjectBlueprint().status) && (!isFreeCreativeProject() || String(selectedProjectBlueprint().id) === freeStageHeadRef('brief'))" @click="createProjectBlueprintVersion" :disabled="isFreeCreativeProject() && !freeStageCan('brief', 'can_create_revision')"><i class="bi bi-files me-1"></i><span x-text="isFreeCreativeProject() ? '创建修订版' : '基于此版本新建'"></span></button><span class="small text-muted">草稿 · 已完成 · 已替代</span><a class="btn btn-outline-secondary btn-sm" x-show="currentGeneratedResourceId('brief')" :href="creativeGeneratedDownloadUrl('brief', 'md')"><i class="bi bi-download me-1"></i>导出</a></div>
                    </div></template>
                </div>
</template>
</div>
