<section>
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h3 class="mb-0">剧目检索下载</h3>
            </div>
            <div class="row g-3">
                <div class="col-12">
                    <div class="card mb-3">
                        <div class="card-header">检索并选择剧集</div>
                        <div class="card-body">
                            <div class="position-relative mb-3">
                                <div class="input-group">
                                    <select class="form-select" style="max-width: 140px" x-model="dramaAnalysis.platform" @change="changeDramaSearchPlatform" aria-label="检索平台"><option value="hg">红果</option><option value="dy">抖音</option></select>
                                    <input class="form-control" x-model="dramaAnalysis.title" @keydown.enter="searchDrama" autocomplete="off" :placeholder="dramaAnalysis.platform === 'dy' ? '输入剧名，检索抖音视频' : '输入完整剧名，检索全部红果剧源'">
                                    <button class="btn btn-primary" @click="searchDrama" :disabled="dramaAnalysis.loading || !dramaAnalysis.title.trim()">
                                        <i class="bi bi-search me-1"></i>搜索
                                    </button>
                                </div>
                            </div>
                            <div class="alert alert-danger" x-show="dramaAnalysis.error" x-text="dramaAnalysis.error"></div>
                            <div class="alert alert-warning" x-show="isDouyinDramaSearch()">
                                <div class="fw-semibold" x-text="dramaAnalysis.searchSource === 'douyin_fallback' ? '红果检索已降级至抖音' : '抖音检索结果'"></div>
                                <div class="small" x-text="dramaAnalysis.fallbackReason"></div>
                                <div class="small mt-1">请手动确认视频。候选可能是推广或片段，并非完整剧集。</div>
                            </div>
                            <div class="list-group mb-3" x-show="dramaAnalysis.candidates.length">
                                <template x-for="candidate in dramaAnalysis.candidates" :key="`${candidate.source_platform || 'hongguo'}:${candidate.book_id || candidate.aweme_id}`">
                                    <button type="button" class="list-group-item list-group-item-action bg-transparent text-light border-secondary" :class="{active: (candidate.book_id && dramaAnalysis.selected?.book_id === candidate.book_id) || (candidate.aweme_id && dramaAnalysis.selected?.aweme_id === candidate.aweme_id)}" @click="selectDramaCandidate(candidate)" :disabled="dramaAnalysis.loading">
                                        <div class="d-flex gap-3 align-items-center">
                                            <img x-show="candidate.cover" :src="candidate.cover" alt="" style="width: 42px; height: 56px; object-fit: cover;">
                                            <div class="text-start">
                                                <div class="fw-semibold" x-text="candidate.title || '未命名剧目'"></div>
                                                <div class="small text-muted" x-show="!isDouyinDramaSearch()" x-text="`${candidate.episode_count || '-'} 集 · ${candidate.summary || '暂无简介'}`"></div>
                                                <div class="small text-muted" x-show="isDouyinDramaSearch()" x-text="`${candidate.author || '未知作者'} · 时长 ${formatDramaDuration(candidate.duration)} · 点赞 ${candidate.like_count || 0} · 评论 ${candidate.comment_count || 0}`"></div>
                                            </div>
                                        </div>
                                    </button>
                                </template>
                            </div>
                            <div x-show="dramaAnalysis.selected" class="border border-secondary p-3">
                                <div class="fw-semibold mb-3" x-text="dramaAnalysis.selected?.title"></div>
                                <div x-show="!isDouyinDramaSearch()" class="row g-3 align-items-end">
                                    <div class="col-md-8">
                                        <label class="form-label">集数</label>
                                        <select class="form-select" x-model.number="dramaAnalysis.episode">
                                            <template x-for="episode in dramaAnalysis.episodes" :key="episode.episode">
                                                <option :value="episode.episode" x-text="`${episode.episode}. ${episode.title}`"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="col-md-4 d-grid">
                                        <button class="btn btn-success" @click="startDramaAnalysis" :disabled="dramaAnalysis.loading || !dramaAnalysis.episode">
                                            <i class="bi bi-download me-1"></i>下载剧集
                                        </button>
                                    </div>
                                </div>
                                <div x-show="isDouyinDramaSearch()">
                                    <div class="alert alert-warning py-2">
                                        <span x-text="`来源：抖音 · 作者：${dramaAnalysis.selected?.author || '未知作者'} · 视频：${dramaAnalysis.selected?.title || ''}`"></span>
                                        <div class="small mt-1">该视频可能是推广或片段，非完整剧集；确认后仅下载这一个视频。</div>
                                    </div>
                                    <button class="btn btn-success" @click="startDramaAnalysis" :disabled="dramaAnalysis.loading || !dramaAnalysis.selected?.aweme_id">
                                        <i class="bi bi-download me-1"></i>下载抖音视频并解析
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card" x-show="dramaAnalysis.jobId">
                        <div class="card-header">下载产物</div>
                        <div class="card-body">
                            <div class="mb-2">任务：<span x-text="dramaAnalysis.jobId"></span></div>
                            <div class="d-flex gap-2 flex-wrap">
                                <template x-for="item in dramaJobArtifacts()" :key="item.path">
                                    <button class="btn btn-sm btn-outline-light" @click="downloadFile(item.path)" x-text="item.path.replace(/\\/g, '/').split('/').pop()"></button>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="card mt-3">
                        <div class="card-header d-flex align-items-center justify-content-between"><span><i class="bi bi-chat-square-text me-2"></i>剧评检索下载</span><span class="badge bg-secondary" x-text="dramaReviewStatusLabel()"></span></div>
                        <div class="card-body">
                            <div class="row g-2 align-items-end"><div class="col-md-7"><label class="form-label">剧名</label><input class="form-control" x-model.trim="dramaReviews.title" placeholder="输入需要检索的剧名"></div><div class="col-md-3"><label class="form-label">数量限制</label><input class="form-control" type="number" min="1" max="10000" step="1" x-model.number="dramaReviews.limit"></div><div class="col-md-2 d-grid"><button type="button" class="btn btn-outline-primary" @click="startDramaReviewCapture" :disabled="dramaReviews.loading || dramaReviews.polling"><span x-show="dramaReviews.loading" class="spinner-border spinner-border-sm me-1"></span><i x-show="!dramaReviews.loading" class="bi bi-search me-1"></i>检索</button></div></div>
                            <div class="alert alert-danger mt-3 mb-0" x-show="dramaReviews.error" x-text="dramaReviews.error"></div>
                            <div class="d-flex align-items-center justify-content-between mt-3" x-show="dramaReviews.jobId"><span class="small text-muted" x-text="`已获取 ${dramaReviews.reviewCount} / ${dramaReviews.sourceTotal || '-'} 条剧评`"></span><button type="button" class="btn btn-sm btn-outline-secondary" x-show="dramaReviews.status === 'completed'" @click="downloadDramaReviews"><i class="bi bi-download me-1"></i>下载 CSV</button></div>
                            <div class="table-responsive mt-2" x-show="dramaReviews.items.length"><table class="table table-sm table-hover mb-0"><thead><tr><th>用户</th><th>剧评</th><th>时间</th><th>点赞</th></tr></thead><tbody><template x-for="review in dramaReviews.items" :key="review.comment_id"><tr><td x-text="review.author || '-' "></td><td class="text-break" x-text="review.content || '-' "></td><td class="text-nowrap" x-text="review.created_at || '-' "></td><td x-text="review.like_count || 0"></td></tr></template></tbody></table></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
