<div class="modal fade" id="creativeEpisodeDownloadModal" tabindex="-1" aria-labelledby="creativeEpisodeDownloadModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="creativeEpisodeDownloadModalLabel" x-text="`${creativeStageLabel(creativeWorkspace.episodeDownload.stage)}下载`"></h5>
                    <div class="small text-muted">可选择多集，也可一次下载全部已生成集数</div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <label class="form-check border border-secondary rounded p-3 mb-3 d-flex align-items-center gap-2">
                    <input class="form-check-input m-0 flex-shrink-0" type="checkbox" x-model="creativeWorkspace.episodeDownload.allEpisodes" @change="toggleEpisodeDownloadAll">
                    <span class="fw-semibold">全集</span>
                    <span class="small text-muted" x-text="`（已生成 ${episodeDownloadAvailableNumbers().length} 集）`"></span>
                </label>
                <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-2">
                    <template x-for="episodeNumber in episodeDownloadAvailableNumbers()" :key="`download-episode-${episodeNumber}`">
                        <div class="col">
                            <label class="form-check border border-secondary rounded p-2 h-100 d-flex align-items-center gap-2">
                                <input class="form-check-input m-0 flex-shrink-0" type="checkbox" :value="episodeNumber" x-model.number="creativeWorkspace.episodeDownload.selectedEpisodes" @change="syncEpisodeDownloadAll">
                                <span class="text-nowrap" x-text="`第 ${episodeNumber} 集`"></span>
                            </label>
                        </div>
                    </template>
                </div>
                <div class="mt-3">
                    <label class="form-label small" for="creative-episode-download-format">下载格式</label>
                    <select id="creative-episode-download-format" class="form-select form-select-sm" x-model="creativeWorkspace.episodeDownload.format">
                        <option value="md" x-show="creativeWorkspace.episodeDownload.stage !== 'script'">Markdown</option>
                        <option value="txt" x-show="creativeWorkspace.episodeDownload.stage === 'script'">TXT</option>
                        <option value="json">JSON</option>
                    </select>
                </div>
                <div class="mt-4" x-show="creativeWorkspace.episodeDownload.stage === 'script' && (creativeWorkspace.episodeDownload.videoModels || []).length">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <div class="fw-semibold">导出视频尺寸建议</div>
                            <div class="small text-muted">默认勾选已确认方案；没有确认时使用平台适配推荐。这里的调整只影响本次导出。</div>
                        </div>
                    </div>
                    <div class="vstack gap-2">
                        <template x-for="item in (creativeWorkspace.episodeDownload.videoModels || [])" :key="`export-video-${item.modelKey}`">
                            <div class="border border-secondary rounded p-3">
                                <div class="row g-2 align-items-end">
                                    <div class="col-md-4">
                                        <label class="form-check d-flex align-items-center gap-2 mb-0">
                                            <input class="form-check-input m-0" type="checkbox" x-model="item.enabled">
                                            <span class="fw-semibold" x-text="item.displayName"></span>
                                        </label>
                                        <div class="small text-muted ms-4" x-text="videoParameterScenarioLabel(item.scenario)"></div>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small">画幅</label>
                                        <select class="form-select form-select-sm" x-model="item.ratio" :disabled="!item.enabled">
                                            <option value="9:16">9:16 · 竖屏</option>
                                            <option value="16:9">16:9 · 横屏</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small">模型分辨率档位</label>
                                        <select class="form-select form-select-sm" x-model="item.resolutionTier" :disabled="!item.enabled">
                                            <template x-for="tier in item.resolutionOptions" :key="`${item.modelKey}-${tier}`"><option :value="tier" x-text="tier"></option></template>
                                        </select>
                                    </div>
                                    <div class="col-md-2 small text-muted" x-text="item.ratio === '9:16' ? '母版 1080×1920' : '母版 1920×1080'"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" @click="downloadSelectedEpisodes" :disabled="!creativeWorkspace.episodeDownload.selectedEpisodes.length">
                    <i class="bi bi-download me-1"></i><span x-text="episodeDownloadActionLabel()"></span>
                </button>
            </div>
        </div>
    </div>
</div>
