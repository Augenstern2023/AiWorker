{% extends "layouts/base.html" %}

{% block styles %}
<style>
    .writer-agent-layout { display: grid; grid-template-columns: minmax(210px, 250px) minmax(0, 1fr) minmax(230px, 290px); min-height: calc(100vh - 118px); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .writer-agent-sidebar, .writer-agent-reports { min-height: 0; overflow-y: auto; padding: 18px; }
    .writer-agent-sidebar { border-right: 1px solid var(--border); }
    .writer-agent-reports { border-left: 1px solid var(--border); }
    .writer-agent-session-detail { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .writer-agent-session { width: 100%; padding: 10px 8px; color: var(--text); text-align: left; background: transparent; border: 1px solid transparent; border-radius: 4px; }
    .writer-agent-session:hover, .writer-agent-session.is-active { background: rgba(59, 149, 246, .12); border-color: rgba(59, 149, 246, .45); }
    .writer-agent-chat { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
    .writer-agent-messages { min-height: 0; overflow-y: auto; padding: 28px clamp(18px, 4vw, 68px); }
    .writer-agent-empty { max-width: 620px; min-height: 100%; margin: auto; display: flex; flex-direction: column; justify-content: center; }
    .writer-agent-message { max-width: min(760px, 100%); padding: 14px 16px; border-left: 3px solid var(--border); white-space: pre-wrap; }
    .writer-agent-message.is-user { margin-left: auto; border-left: 0; border-right: 3px solid var(--accent); }
    .writer-agent-thinking { border-left-color: var(--accent); }
    .writer-agent-thinking-dots::after { content: ""; display: inline-block; width: 1.2em; animation: writer-agent-thinking 1.2s steps(4, end) infinite; }
    .writer-agent-material-card { border: 1px solid var(--border); border-radius: 6px; background: rgba(255,255,255,.02); }
    .writer-agent-composer { padding: 16px clamp(18px, 4vw, 68px) 22px; border-top: 1px solid var(--border); background: var(--bg-page); }
    .writer-agent-composer-box { max-width: 860px; margin: 0 auto; border: 1px solid var(--border); border-radius: 8px; background: #151722; }
    .writer-agent-composer textarea { min-height: 88px; resize: none; border: 0; box-shadow: none !important; }
    .writer-agent-report-file { border-bottom: 1px solid var(--border); padding: 13px 0; }
    .writer-agent-report-file:first-child { border-top: 1px solid var(--border); }
    .writer-agent-report-preview { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    @keyframes writer-agent-thinking { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
    @media (max-width: 1100px) { .writer-agent-layout { grid-template-columns: 210px minmax(0, 1fr); } .writer-agent-reports { grid-column: 1 / -1; max-height: 260px; border-top: 1px solid var(--border); border-left: 0; } }
    @media (max-width: 760px) { .writer-agent-layout { display: block; min-height: 0; } .writer-agent-sidebar, .writer-agent-reports { max-height: 240px; border: 0; border-bottom: 1px solid var(--border); } .writer-agent-chat { min-height: 640px; } }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-start gap-3 mb-3">
    <div><h3 class="mb-1">编剧大师</h3><div class="small text-muted">独立诊断工作台，不关联创作项目或工作流</div></div>
    <button id="writer-agent-refresh" class="btn btn-outline-light btn-sm" type="button" title="刷新会话" aria-label="刷新会话"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>
</div>
<div id="writer-agent-error" class="alert alert-danger d-none mb-3" role="alert"></div>

<div class="writer-agent-layout">
    <aside class="writer-agent-sidebar" aria-label="创作会话">
        <div class="d-flex justify-content-between align-items-center pb-3"><h5 class="mb-0">创作会话</h5><button id="writer-agent-new" class="btn btn-outline-light btn-sm" type="button" title="新建会话" aria-label="新建会话"><i class="bi bi-plus-lg" aria-hidden="true"></i></button></div>
        <div id="writer-agent-sessions"><div class="small text-muted py-3">正在读取会话...</div></div>
        <section id="writer-agent-session-detail" class="writer-agent-session-detail d-none mt-3 py-3">
            <div class="small text-muted mb-1">当前会话</div><div id="writer-agent-session-title" class="fw-semibold text-break"></div><div id="writer-agent-material-name" class="small text-muted mt-2"></div>
        </section>
    </aside>

    <main class="writer-agent-chat" aria-label="编剧对话">
        <div id="writer-agent-messages" class="writer-agent-messages" aria-live="polite">
            <section id="writer-agent-empty" class="writer-agent-empty"><h4>和编剧大师聊聊</h4><p class="text-muted mb-0">粘贴剧本、大纲或角色设定，也可以上传文本文件开始诊断。</p></section>
            <div id="writer-agent-conversation" class="d-grid gap-4 d-none"></div>
        </div>
        <section id="writer-agent-composer" class="writer-agent-composer" aria-label="消息输入">
            <div class="writer-agent-composer-box">
                <textarea id="writer-agent-message" class="form-control" rows="3" placeholder="粘贴创作材料，或继续和编剧大师讨论剧情"></textarea>
                <div class="d-flex align-items-center gap-2 px-2 pb-2"><input id="writer-agent-file" class="d-none" type="file" accept=".txt,.text,.md,.markdown,.mdown,.fountain,.fd,.rst,.docx,.pdf,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf"><button id="writer-agent-attach" class="btn btn-outline-light btn-sm" type="button" title="上传文本、Word 或 PDF 文件" aria-label="上传文本、Word 或 PDF 文件"><i class="bi bi-paperclip" aria-hidden="true"></i></button><span id="writer-agent-file-name" class="small text-muted text-truncate flex-grow-1"></span><button id="writer-agent-send" class="btn btn-primary btn-sm" type="button" title="发送" aria-label="发送"><i class="bi bi-send" aria-hidden="true"></i></button></div>
            </div>
        </section>
    </main>

    <aside class="writer-agent-reports" aria-label="评审报告文件">
        <div class="d-flex justify-content-between align-items-center pb-3"><h5 class="mb-0">评审报告</h5><span id="writer-agent-report-status" class="small text-muted">等待材料</span></div>
        <div id="writer-agent-reports" class="small text-muted">每轮有效评审会在这里生成可下载的 Markdown 报告。</div>
    </aside>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/review/writer_agent.js?v={{ asset_version }}-writer-agent-chat"></script>{% endblock %}
