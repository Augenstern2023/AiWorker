        <h3 class="mb-1">场次剧本</h3>
        <div class="small text-muted">项目 {{ project_id }} · 第 {{ episode_number }} 集 · 可拍摄场次、动作与台词</div>

    <a id="script-page-back-link" class="btn btn-outline-light btn-sm flex-shrink-0" href="/writing/projects/{{ project_id }}/episodes/{{ episode_number }}/beats" title="返回 Beats" aria-label="返回 Beats">
