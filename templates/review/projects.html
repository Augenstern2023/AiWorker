{% extends "layouts/base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
    <div>
        <h3 class="mb-1">负责项目</h3>
        <div class="small text-muted">由我管理的创作项目，可从选题库创建新项目</div>
    </div>
    <a class="btn btn-outline-light btn-sm" href="/selection/topics" title="前往选题库创建项目及任务">
        <i class="bi bi-folder-plus me-1" aria-hidden="true"></i>选题库
    </a>
</div>
<div id="managed-project-error" class="alert alert-danger d-none" role="alert"></div>
<div id="managed-projects" data-project-id="{{ project_id or '' }}">
    <div class="table-responsive">
        <table class="table table-sm align-middle">
            <thead>
                <tr>
                    <th>项目</th>
                    <th>来源选题</th>
                    <th>项目状态</th>
                    <th class="text-end">操作</th>
                </tr>
            </thead>
            <tbody id="managed-project-list">
                <tr id="managed-project-skeleton" aria-hidden="true">
                    <td colspan="4">
                        <div class="ui-skeleton" style="height:20px;width:60%;margin:8px 0;"></div>
                        <div class="ui-skeleton" style="height:14px;width:40%;"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/review/projects.js?v={{ asset_version }}"></script>{% endblock %}
