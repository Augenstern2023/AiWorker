{% extends "layouts/base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
    <div><h3 class="mb-1">选品工作概览</h3><div class="small text-muted">榜单、候选选题与采纳进度</div></div>
    <div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" href="/selection/ranks"><i class="bi bi-trophy me-1"></i>今日榜单</a><a class="btn btn-primary btn-sm" href="/selection/hits"><i class="bi bi-stars me-1"></i>今日爆款</a></div>
</div>
<div class="row g-3">
    <div class="col-md-4"><div class="card"><div class="card-body"><div class="small text-muted">候选选题</div><div class="display-6" id="stat-candidates">-</div></div></div></div>
    <div class="col-md-4"><div class="card"><div class="card-body"><div class="small text-muted">选题库</div><div class="display-6" id="stat-library">-</div></div></div></div>
    <div class="col-md-4"><div class="card"><div class="card-body"><div class="small text-muted">已采纳选题</div><div class="display-6" id="stat-adopted">-</div></div></div></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/common/api.js"></script>
<script src="/static/js/selection/topics.js"></script>
<script src="/static/js/selection/dashboard.js"></script>
{% endblock %}
