<div id="project-script-workspace">
    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <h5 class="mb-1">场次剧本</h5>
            <div class="small text-muted" x-text="isFreeCreativeProject() ? '当前集可独立创作；完成剧本后同样进入审核、优化和最终交付。' : '基于已锁定 Beats 生成可拍摄场次与台词'"></div>
            <div class="small text-muted" x-show="!isFreeCreativeProject()" x-text="projectScriptsSeriesBlockReason()"></div>
        </div>
        <div class="d-flex gap-2 align-items-end flex-wrap justify-content-end">
            <button class="btn btn-outline-info btn-sm" type="button" @click="openPromptLibrary('script')" title="选择场次剧本生成模板"><i class="bi bi-sliders me-1"></i>选择生成模板</button>
            <div>
                <label class="form-label small">集数</label>
                <select class="form-select form-select-sm" style="width:150px" x-model.number="creativeWorkspace.selectedEpisode">
                    <option :value="0">全集</option>
                    <template x-for="episodeNumber in Array.from({length: Number(creativeWorkspace.project.target_episode_count || 0)}, (_, index) => index + 1)" :key="`script-episode-${episodeNumber}`">
                        <option :value="episodeNumber" x-text="`第 ${episodeNumber} 集${projectEpisodeScript(episodeNumber) ? ' · 已生成' : ' · 未生成'}`"></option>
                    </template>
                </select>
            </div>
            <button class="btn btn-primary btn-sm" @click="generateProjectScript" :disabled="creativeWorkspace.selectedEpisode === 0 || creativeActionDisabled('script') || (isFreeCreativeProject() && !freeStageCan('script', 'can_generate'))"><i class="bi bi-magic me-1"></i><span x-text="creativeActionRunning('script') ? '生成中' : projectScriptGenerationActionLabel()"></span></button>
            <button class="btn btn-outline-light btn-sm" x-show="isFreeCreativeProject()" @click="createFreeBlankResource('script')" :disabled="creativeWorkspace.selectedEpisode === 0 || !freeStageCan('script', 'can_create_blank')"><i class="bi bi-plus-lg me-1"></i>空白版本</button>
            <button class="btn btn-outline-primary btn-sm" @click="generateProjectScriptsSeries" :disabled="creativeActionDisabled('script', {series: true}) || (!isFreeCreativeProject() && !canGenerateProjectScriptsSeries())" :title="projectScriptsSeriesBlockReason()"><i class="bi bi-collection-play me-1"></i><span x-text="creativeActionRunning('script') ? '全剧生成中' : seriesGenerationActionLabel('script')"></span></button>
            <button class="btn btn-warning btn-sm" @click="completeProjectScriptsBatch" :disabled="creativeActionDisabled('script') || !canBatchLockProjectEpisodes('script')" title="完成并锁定当前全部场次剧本草稿"><i class="bi bi-lock-fill me-1"></i><span x-text="isFreeCreativeProject() ? '全集完成并锁定' : '批量完成并锁定'"></span></button>
            <button class="btn btn-outline-secondary btn-sm" type="button" x-show="projectStageEpisodeItems('script').length" @click="openEpisodeDownload('script')" title="选择多集或全集下载"><i class="bi bi-download me-1"></i>多集/全集下载</button>
        </div>
    </div>

    <section class="card border-secondary mb-3" x-show="videoParameterSourceCount() > 0" x-cloak aria-labelledby="video-parameter-heading">
        <div class="card-header d-flex justify-content-between align-items-start gap-3 flex-wrap">
            <div>
                <h6 id="video-parameter-heading" class="mb-1"><i class="bi bi-aspect-ratio me-1"></i>AI 视频规格建议</h6>
                <div class="small text-muted">
                    基于当前有效场次剧本分析 · <span x-text="`已覆盖 ${videoParameterSourceCount()}/${Number(creativeWorkspace.project.target_episode_count || 0)} 集`"></span>
                    <span class="badge text-bg-warning ms-1" x-show="creativeWorkspace.videoParameters.record?.stale">剧本已变化</span>
                    <span class="badge text-bg-secondary ms-1" x-show="creativeWorkspace.videoParameters.record?.recommendation?.analysis_mode === 'rules_fallback'">规则默认建议</span>
                </div>
            </div>
            <button class="btn btn-outline-info btn-sm" type="button"
                    @click="analyzeVideoParameters()"
                    :disabled="creativeWorkspace.videoParameters.analyzing || videoParameterAnalysisRunning() || !videoParameterCanWrite()">
                <span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.videoParameters.analyzing || videoParameterAnalysisRunning()"></span>
                <i class="bi bi-stars me-1" x-show="!creativeWorkspace.videoParameters.analyzing && !videoParameterAnalysisRunning()"></i>
                <span x-text="videoParameterAnalysisRunning() ? '分析中' : (creativeWorkspace.videoParameters.record ? '重新分析' : '分析视频参数')"></span>
            </button>
        </div>
        <div class="card-body">
            <div class="alert alert-danger py-2" x-show="creativeWorkspace.videoParameters.error" x-text="creativeWorkspace.videoParameters.error"></div>
            <div class="alert alert-warning py-2" x-show="creativeWorkspace.videoParameters.record?.status === 'failed'">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span x-text="creativeWorkspace.videoParameters.record?.analysis_error || '视频规格分析未完成，请重新分析'"></span>
            </div>
            <div class="py-2" x-show="videoParameterAnalysisRunning()">
                <div class="d-flex justify-content-between gap-3 text-muted small mb-2">
                    <span><i class="bi bi-hourglass-split me-1"></i><span x-text="videoParameterAnalysisMessage()"></span></span>
                    <span class="text-nowrap" x-text="videoParameterRemainingSeconds() > 0 ? `最迟 ${videoParameterRemainingSeconds()} 秒后完成` : '正在切换规则建议'"></span>
                </div>
                <div class="progress" role="progressbar" aria-label="视频规格分析进度" :aria-valuenow="videoParameterAnalysisProgress()" aria-valuemin="0" aria-valuemax="100" style="height: 6px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" :style="`width: ${videoParameterAnalysisProgress()}%`"></div>
                </div>
                <div class="small text-muted mt-2">AI 分析最多等待 <span x-text="creativeWorkspace.videoParameters.analysisDeadlineSeconds"></span> 秒；超时后自动生成可用的规则建议，不会一直等待。</div>
            </div>
            <div class="small text-muted py-2" x-show="!creativeWorkspace.videoParameters.record && !videoParameterAnalysisRunning()">
                全剧完成后会首次自动分析；剧本尚未完整时也可以手动分析已有内容。
            </div>
            <template x-if="creativeWorkspace.videoParameters.record?.recommendation?.models">
                <div>
                    <template x-for="vendor in [{name: 'MiniMax', keys: ['minimax_h3', 'minimax_h3_max']}, {name: 'Seedance', keys: ['seedance_2_5']}]" :key="vendor.name">
                        <div class="mb-4">
                            <h6 class="border-bottom pb-2" x-text="vendor.name"></h6>
                            <template x-for="modelKey in vendor.keys" :key="modelKey">
                                <div class="border border-secondary rounded p-3 mb-3" x-show="videoParameterModel(modelKey)">
                                    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                                        <div>
                                            <span class="fw-semibold" x-text="videoParameterModel(modelKey)?.capability?.display_name"></span>
                                            <code class="small ms-1" x-text="videoParameterModel(modelKey)?.capability?.model_id"></code>
                                        </div>
                                        <span class="badge text-bg-success" x-show="confirmedVideoParameter(modelKey)" x-text="confirmedVideoParameter(modelKey) ? `已确认 · ${videoParameterScenarioLabel(confirmedVideoParameter(modelKey).scenario)}` : ''"></span>
                                    </div>
                                    <div class="small text-muted mb-3" x-text="`模型能力：${(videoParameterModel(modelKey)?.capability?.resolution_tiers || []).join(' / ')} · 单片段 ${videoParameterModel(modelKey)?.capability?.duration_seconds?.min}-${videoParameterModel(modelKey)?.capability?.duration_seconds?.max} 秒 · ${(videoParameterModel(modelKey)?.capability?.supported_ratios || []).join('、')}`"></div>
                                    <div class="row g-3">
                                        <template x-for="scenario in videoParameterScenarioKeys()" :key="`${modelKey}:${scenario}`">
                                            <div class="col-xl-6" x-show="videoParameterProfile(modelKey, scenario)">
                                                <div class="h-100 rounded border p-3" :class="videoParameterIsConfirmed(modelKey, scenario) ? 'border-success bg-success bg-opacity-10' : 'border-secondary'">
                                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                                        <span class="fw-semibold" x-text="videoParameterScenarioLabel(scenario)"></span>
                                                        <span class="small text-muted" x-text="`可信评分 ${Math.round(Number(videoParameterProfile(modelKey, scenario)?.confidence || 0) * 100)}%`"></span>
                                                    </div>
                                                    <div class="d-flex flex-wrap gap-2 mb-2">
                                                        <span class="badge text-bg-primary" x-text="videoParameterOrientationLabel(videoParameterProfile(modelKey, scenario))"></span>
                                                        <span class="badge text-bg-secondary" x-text="videoParameterProfile(modelKey, scenario)?.ratio"></span>
                                                        <span class="badge text-bg-secondary" x-text="`生成 ${videoParameterProfile(modelKey, scenario)?.resolution_tier}`"></span>
                                                        <span class="badge text-bg-secondary" x-text="`${videoParameterProfile(modelKey, scenario)?.clip_duration_seconds} 秒/片段`"></span>
                                                        <span class="badge text-bg-secondary" x-show="videoParameterProfile(modelKey, scenario)?.fps?.value" x-text="`${videoParameterProfile(modelKey, scenario)?.fps?.value} FPS`"></span>
                                                    </div>
                                                    <div class="small mb-2"><span class="text-muted">交付母版：</span><span x-text="videoParameterProfile(modelKey, scenario)?.delivery?.master_resolution"></span></div>
                                                    <p class="small mb-2" x-text="videoParameterProfile(modelKey, scenario)?.rationale"></p>
                                                    <ul class="small text-muted ps-3 mb-2" x-show="(videoParameterProfile(modelKey, scenario)?.evidence || []).length">
                                                        <template x-for="item in (videoParameterProfile(modelKey, scenario)?.evidence || [])" :key="item"><li x-text="item"></li></template>
                                                    </ul>
                                                    <details class="small mb-3" x-show="(videoParameterProfile(modelKey, scenario)?.special_scene_risks || []).length">
                                                        <summary>特殊场景构图风险</summary>
                                                        <ul class="ps-3 mt-2 mb-0">
                                                            <template x-for="risk in (videoParameterProfile(modelKey, scenario)?.special_scene_risks || [])" :key="`${risk.episode_number}:${risk.scene}`">
                                                                <li><span x-text="risk.episode_number ? `第 ${risk.episode_number} 集` : '特殊场景'"></span> · <span x-text="risk.risk"></span>；<span x-text="risk.suggestion"></span></li>
                                                            </template>
                                                        </ul>
                                                    </details>
                                                    <button class="btn btn-sm" type="button"
                                                            :class="videoParameterIsConfirmed(modelKey, scenario) ? 'btn-success' : 'btn-outline-success'"
                                                            @click="confirmVideoParameter(modelKey, scenario)"
                                                            :disabled="creativeWorkspace.videoParameters.record?.stale || !videoParameterCanWrite() || creativeWorkspace.videoParameters.confirming || videoParameterIsConfirmed(modelKey, scenario)">
                                                        <span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.videoParameters.confirming === `${modelKey}:${scenario}`"></span>
                                                        <span x-text="videoParameterIsConfirmed(modelKey, scenario) ? '已确认' : '确认此方案'"></span>
                                                    </button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </section>

    <div x-show="creativeWorkspace.selectedEpisode === 0" x-cloak>
        <template x-for="item in projectStageEpisodeItems('script')" :key="`all-script-${item.id}`">
            <section class="border border-secondary rounded p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div><span class="fw-semibold" x-text="`第 ${item.episode_number} 集 · ${item.content?.episode_title || '未命名'} `"></span><span class="small text-muted" x-text="`v${item.version} · ${creativeWorkflowStatusLabel(item.status)}`"></span></div>
                    <a class="btn btn-outline-primary btn-sm" :href="creativeModuleUrl('script', item.episode_number)">打开单集编辑</a>
                </div>
                <div class="small text-muted mb-2" data-template-provenance x-text="creativeTemplateProvenance(item)"></div>
                <template x-for="scene in (item.content?.scenes || [])" :key="`all-scene-${item.id}-${scene.sequence_no}-${scene.scene_no}`">
                    <div class="border-top py-3">
                        <div class="small fw-semibold mb-2" x-text="`[${scene.sequence_no}]-[${scene.scene_no}] [${scene.time_of_day || ''}] [${scene.interior_exterior || ''}] [${scene.location || ''}]`"></div>
                        <div class="small text-muted mb-2" x-text="`道具：${listText(scene.props) || '无'}　出场人物：${listText(scene.characters) || '无'}`"></div>
                        <template x-for="(block, blockIndex) in (scene.blocks || [])" :key="`all-block-${item.id}-${scene.sequence_no}-${scene.scene_no}-${blockIndex}`">
                            <p class="mb-2" x-text="scriptBlockDisplayText(block)"></p>
                        </template>
                    </div>
                </template>
            </section>
        </template>
        <div class="text-center text-muted py-4" x-show="!projectStageEpisodeItems('script').length">尚未生成任何场次剧本</div>
    </div>

    <template x-if="creativeWorkspace.selectedEpisode > 0 && selectedProjectScript()">
        <div>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-semibold" x-text="`第 ${creativeWorkspace.selectedEpisode} 集 · v${selectedProjectScript().version} · ${creativeWorkflowStatusLabel(selectedProjectScript().status)}`"></span>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-light btn-sm" @click="saveProjectEpisode(selectedProjectScript())" :disabled="!creativeResourceEditable(selectedProjectScript())"><i class="bi bi-save me-1"></i>保存</button>
                    <button class="btn btn-warning btn-sm" @click="completeProjectScript" :disabled="!creativeResourceEditable(selectedProjectScript())"><i class="bi bi-lock-fill me-1"></i>完成并锁定</button>
                    <button class="btn btn-outline-info btn-sm" x-show="isFreeCreativeProject() && ['locked', 'approved'].includes(selectedProjectScript().status)" @click="createFreeResourceRevision('script')" :disabled="!freeStageCan('script', 'can_create_revision')"><i class="bi bi-files me-1"></i>创建修订版</button>
                    <button class="btn btn-outline-info btn-sm" type="button" @click="openEpisodeDownload('script')" title="多集或全集剧本下载"><i class="bi bi-download me-1"></i>剧本下载</button>
                    <a class="btn btn-outline-info btn-sm" x-show="!isFreeCreativeProject()" :href="mergedScriptDownloadUrl()" title="按已确认或默认推荐尺寸合并下载全部场次剧本"><i class="bi bi-collection me-1"></i>全集下载</a>
                    <a class="btn btn-outline-secondary btn-sm" :href="`/api/creative/projects/${creativeWorkspace.project.id}/generated-content/download?stage=script&resource_id=${selectedProjectScript().id}&format=txt`" title="下载本集 TXT"><i class="bi bi-download me-1"></i>本集下载</a>
                </div>
            </div>
            <div class="small text-muted mb-2" data-template-provenance x-text="creativeTemplateProvenance(selectedProjectScript())"></div>
            <div class="mb-3"><label class="form-label small">集标题</label><input class="form-control form-control-sm" x-model="selectedProjectScript().content.episode_title" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
            <template x-for="scene in selectedProjectScript().content.scenes" :key="`${scene.sequence_no}-${scene.scene_no}`">
                <div class="border-top py-3">
                    <div class="row g-2">
                        <div class="col-3"><label class="form-label small">段</label><input class="form-control form-control-sm" type="number" min="1" x-model.number="scene.sequence_no" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                        <div class="col-3"><label class="form-label small">场</label><input class="form-control form-control-sm" type="number" min="1" x-model.number="scene.scene_no" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                        <div class="col-3"><label class="form-label small">时间</label><input class="form-control form-control-sm" x-model="scene.time_of_day" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                        <div class="col-3"><label class="form-label small">内外</label><input class="form-control form-control-sm" x-model="scene.interior_exterior" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                        <div class="col-md-6"><label class="form-label small">场景</label><input class="form-control form-control-sm" x-model="scene.location" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                        <div class="col-md-3"><label class="form-label small">道具</label><input class="form-control form-control-sm" :value="listText(scene.props)" @input="setListField(scene, 'props', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                        <div class="col-md-3"><label class="form-label small">出场人物</label><input class="form-control form-control-sm" :value="listText(scene.characters)" @input="setListField(scene, 'characters', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                    </div>
                    <template x-for="block in scene.blocks">
                        <div class="row g-2 mt-1">
                            <div class="col-md-2"><select class="form-select form-select-sm" x-model="block.type" :disabled="!creativeResourceEditable(selectedProjectScript())"><option value="action">动作</option><option value="dialogue">台词</option><option value="voiceover">画外音</option><option value="inner_voice">内心独白</option><option value="cut">切镜</option></select></div>
                            <div class="col-md-2" x-show="['dialogue', 'voiceover', 'inner_voice'].includes(block.type)"><input class="form-control form-control-sm" placeholder="人物" x-model="block.speaker" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                            <div class="col-md-2" x-show="block.type === 'dialogue'"><input class="form-control form-control-sm" placeholder="情绪" x-model="block.modifier" :disabled="!creativeResourceEditable(selectedProjectScript())"></div>
                            <div class="col"><textarea class="form-control form-control-sm" rows="2" x-model="block.text" :disabled="!creativeResourceEditable(selectedProjectScript())"></textarea></div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </template>
    <div class="text-center text-muted py-4" x-show="creativeWorkspace.selectedEpisode > 0 && !selectedProjectScript()" x-text="scriptWorkspaceEmptyMessage()"></div>
</div>
{% include "common/workspace/prompt_library_modal.html" %}
