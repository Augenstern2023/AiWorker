[project]
name = "aiworker-semif-sidecar"
version = "0.1.0"
description = "Isolated HTTP wrapper for the pinned SemIf screenplay scorer"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.110.2",
    "semif-phase1[llamacpp] @ git+https://github.com/TheoLeeCJ/SemIf.git@1f2dea3e25379f9dfc98cb83c324f00ab5deda37",
    "uvicorn==0.29.0",
]

[project.scripts]
aiworker-semif = "semif_sidecar.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semif_sidecar"]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
