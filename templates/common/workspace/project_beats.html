<div>
                    <div class="d-flex justify-content-between align-items-end mb-3"><div><h5 class="mb-1">单集 Beats</h5><div class="small text-muted">只生成场景节拍、目标、阻力和转折，不生成完整正文或台词</div></div><div class="d-flex gap-2 align-items-end"><div><label class="form-label small">集数</label><input class="form-control form-control-sm" style="width:90px" type="number" min="1" :max="creativeWorkspace.project.target_episode_count" x-model.number="creativeWorkspace.selectedEpisode"></div><button class="btn btn-primary btn-sm" @click="generateProjectBeats" :disabled="creativeActionDisabled('beats')"><span class="spinner-border spinner-border-sm me-1" x-show="creativeActionRunning('beats')"></span><i class="bi bi-magic me-1" x-show="!creativeActionRunning('beats')"></i><span x-text="creativeActionRunning('beats') ? '生成中' : '生成 Beats'"></span></button><a class="btn btn-outline-primary btn-sm" :href="`/writing/projects/${creativeWorkspace.project.id}/episodes/${creativeWorkspace.selectedEpisode}/scripts`" title="场次剧本"><i class="bi bi-file-earmark-richtext"></i></a><a class="btn btn-outline-secondary btn-sm" :href="creativeExportUrl('beats', 'md')"><i class="bi bi-download"></i></a></div></div>
                    <div class="beats-generation-status border-top border-bottom py-2 mb-3" x-show="creativeWorkspace.startingAction === 'beats' || creativeWorkspace.activeAction === 'beats'" x-cloak>
                        <div class="d-flex justify-content-between align-items-center"><span class="small" x-text="creativeWorkspace.jobMessage || '正在创建生成任务'"></span><span class="small text-muted" x-text="creativeProgressText()"></span></div>
                        <div class="progress mt-2" style="height:6px"><div class="progress-bar" :class="creativeWorkspace.jobStatus === 'failed' ? 'bg-danger' : ''" :style="`width:${creativeProgressPercent()}%`"></div></div>
                    </div>
                    <template x-if="selectedProjectBeats()"><div><div class="d-flex justify-content-between align-items-center mb-2"><span class="fw-semibold" x-text="`第 ${creativeWorkspace.selectedEpisode} 集 · v${selectedProjectBeats().version} · ${creativeWorkflowStatusLabel(selectedProjectBeats().status)}`"></span><div class="d-flex gap-2"><button class="btn btn-outline-light btn-sm" @click="saveProjectEpisode(selectedProjectBeats())" :disabled="!creativeResourceEditable(selectedProjectBeats())"><i class="bi bi-save me-1"></i>保存</button><button class="btn btn-warning btn-sm" @click="completeProjectBeats" :disabled="!creativeResourceEditable(selectedProjectBeats())"><i class="bi bi-lock-fill me-1"></i>完成并锁定</button><span class="small text-muted">草稿 · 已完成 · 已替代</span></div></div><table class="table table-sm align-middle"><thead><tr><th style="width:55px">序号</th><th>场景</th><th>人物</th><th>行动目标</th><th>阻力</th><th>情绪变化</th><th>转折</th><th>结尾钩子</th></tr></thead><tbody><template x-for="beat in selectedProjectBeats().content.beats" :key="beat.order"><tr><td x-text="beat.order"></td><td><input class="form-control form-control-sm" x-model="beat.scene" :disabled="!creativeResourceEditable(selectedProjectBeats())"></td><td><input class="form-control form-control-sm" :value="listText(beat.characters)" @input="setListField(beat, 'characters', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBeats())"></td><td><input class="form-control form-control-sm" x-model="beat.goal" :disabled="!creativeResourceEditable(selectedProjectBeats())"></td><td><input class="form-control form-control-sm" x-model="beat.obstacle" :disabled="!creativeResourceEditable(selectedProjectBeats())"></td><td><input class="form-control form-control-sm" x-model="beat.emotion_change" :disabled="!creativeResourceEditable(selectedProjectBeats())"></td><td><input class="form-control form-control-sm" x-model="beat.turn" :disabled="!creativeResourceEditable(selectedProjectBeats())"></td><td><input class="form-control form-control-sm" x-model="beat.hook" :disabled="!creativeResourceEditable(selectedProjectBeats())"></td></tr></template></tbody></table></div></template>
                    <div class="text-center text-muted py-4" x-show="!selectedProjectBeats()">当前集尚未生成 Beats</div>
                </div>
