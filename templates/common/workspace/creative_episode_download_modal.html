<div class="modal fade" id="creativeEpisodeDownloadModal" tabindex="-1" aria-labelledby="creativeEpisodeDownloadModalLabel" aria-hidden="true" @hidden.bs.modal="clearScreenplayExportPreview">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="creativeEpisodeDownloadModalLabel" x-text="`${creativeStageLabel(creativeWorkspace.episodeDownload.stage)}下载`"></h5>
                    <div class="small text-muted" x-text="creativeWorkspace.episodeDownload.stage === 'script' ? '选择集数、模板和文件格式，可先在线预览' : '可选择多集，也可一次下载全部已生成集数'"></div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <section aria-labelledby="creative-export-scope-heading">
                    <h6 id="creative-export-scope-heading">1. 选择集数</h6>
                    <label class="form-check border border-secondary rounded p-3 mb-3 d-flex align-items-center gap-2">
                        <input class="form-check-input m-0 flex-shrink-0" type="checkbox" x-model="creativeWorkspace.episodeDownload.allEpisodes" @change="toggleEpisodeDownloadAll">
                        <span class="fw-semibold">全集</span>
                        <span class="small text-muted" x-text="`（已生成 ${episodeDownloadAvailableNumbers().length} 集）`"></span>
                    </label>
                    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-5 row-cols-lg-6 g-2">
                        <template x-for="episodeNumber in episodeDownloadAvailableNumbers()" :key="`download-episode-${episodeNumber}`">
                            <div class="col">
                                <label class="form-check border border-secondary rounded p-2 h-100 d-flex align-items-center gap-2">
                                    <input class="form-check-input m-0 flex-shrink-0" type="checkbox" :value="episodeNumber" x-model.number="creativeWorkspace.episodeDownload.selectedEpisodes" @change="syncEpisodeDownloadAll">
                                    <span class="text-nowrap" x-text="`第 ${episodeNumber} 集`"></span>
                                </label>
                            </div>
                        </template>
                    </div>
                </section>

                <section class="mt-4" x-show="creativeWorkspace.episodeDownload.stage === 'script'" aria-labelledby="creative-export-template-heading">
                    <div class="d-flex align-items-center justify-content-between gap-3 mb-2">
                        <div>
                            <h6 id="creative-export-template-heading" class="mb-1">2. 选择模板</h6>
                            <div class="small text-muted">预览和各文件格式共享同一份剧本内容，只改变层级、标记和页面版式。</div>
                        </div>
                        <button type="button" class="btn btn-outline-info btn-sm" @click="previewSelectedEpisodes" :disabled="creativeWorkspace.episodeDownload.previewLoading || !creativeWorkspace.episodeDownload.templateId || !creativeWorkspace.episodeDownload.selectedEpisodes.length">
                            <span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.episodeDownload.previewLoading" aria-hidden="true"></span>
                            <i class="bi bi-eye me-1" x-show="!creativeWorkspace.episodeDownload.previewLoading"></i>在线预览
                        </button>
                    </div>
                    <div class="small text-muted py-2" x-show="creativeWorkspace.episodeDownload.templatesLoading">正在读取模板…</div>
                    <div class="alert alert-danger py-2" x-show="creativeWorkspace.episodeDownload.templatesError" x-text="creativeWorkspace.episodeDownload.templatesError"></div>
                    <div class="row row-cols-1 row-cols-md-2 g-3">
                        <template x-for="item in (creativeWorkspace.episodeDownload.templateOptions || [])" :key="`screenplay-template-${item.id}`">
                            <div class="col">
                                <label class="card h-100 border-secondary" :class="creativeWorkspace.episodeDownload.templateId === item.id ? 'border-info shadow-sm' : ''">
                                    <div class="card-body d-flex gap-3 align-items-start">
                                        <input class="form-check-input mt-1" type="radio" name="screenplay-export-template" :value="item.id" :checked="creativeWorkspace.episodeDownload.templateId === item.id" @change="selectScreenplayExportTemplate(item.id)">
                                        <span class="flex-grow-1">
                                            <span class="d-block fw-semibold" x-text="item.name"></span>
                                            <span class="d-block small text-muted mt-1" x-text="item.description"></span>
                                            <button type="button" class="btn btn-link btn-sm px-0 pb-0" @click.prevent="selectScreenplayExportTemplate(item.id); previewSelectedEpisodes()">用此模板预览</button>
                                        </span>
                                    </div>
                                </label>
                            </div>
                        </template>
                    </div>
                    <div class="mt-3" x-show="creativeWorkspace.episodeDownload.previewUrl || creativeWorkspace.episodeDownload.previewError || creativeWorkspace.episodeDownload.previewLoading">
                        <div class="alert alert-danger py-2" x-show="creativeWorkspace.episodeDownload.previewError" x-text="creativeWorkspace.episodeDownload.previewError"></div>
                        <div class="border border-secondary rounded bg-light overflow-hidden" x-show="creativeWorkspace.episodeDownload.previewUrl">
                            <iframe class="w-100 border-0" style="height: min(62vh, 720px)" title="剧本模板在线预览" sandbox :src="creativeWorkspace.episodeDownload.previewUrl"></iframe>
                        </div>
                    </div>
                </section>

                <section class="mt-4" aria-labelledby="creative-export-format-heading">
                    <h6 id="creative-export-format-heading" x-text="creativeWorkspace.episodeDownload.stage === 'script' ? '3. 选择文件格式' : '2. 选择文件格式'"></h6>
                    <label class="form-label small" for="creative-episode-download-format">下载格式</label>
                    <select id="creative-episode-download-format" class="form-select form-select-sm" x-model="creativeWorkspace.episodeDownload.format">
                        <template x-if="creativeWorkspace.episodeDownload.stage === 'script'">
                            <optgroup label="模板化剧本">
                                <option value="md">Markdown</option>
                                <option value="pdf">PDF</option>
                                <option value="docx">Word DOCX</option>
                            </optgroup>
                        </template>
                        <template x-if="creativeWorkspace.episodeDownload.stage !== 'script'">
                            <optgroup label="数据导出">
                                <option value="md">Markdown</option>
                                <option value="json">JSON</option>
                            </optgroup>
                        </template>
                    </select>
                </section>

                <section class="mt-4" x-show="creativeWorkspace.episodeDownload.stage === 'script' && (creativeWorkspace.episodeDownload.videoModels || []).length">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <div class="fw-semibold">经典模板附录中的视频尺寸建议</div>
                            <div class="small text-muted">选择其他模板时不会插入这段附录；这里的调整只影响本次导出。</div>
                        </div>
                    </div>
                    <div class="vstack gap-2">
                        <template x-for="item in (creativeWorkspace.episodeDownload.videoModels || [])" :key="`export-video-${item.modelKey}`">
                            <div class="border border-secondary rounded p-3">
                                <div class="row g-2 align-items-end">
                                    <div class="col-md-4">
                                        <label class="form-check d-flex align-items-center gap-2 mb-0">
                                            <input class="form-check-input m-0" type="checkbox" x-model="item.enabled">
                                            <span class="fw-semibold" x-text="item.displayName"></span>
                                        </label>
                                        <div class="small text-muted ms-4" x-text="videoParameterScenarioLabel(item.scenario)"></div>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small">画幅</label>
                                        <select class="form-select form-select-sm" x-model="item.ratio" :disabled="!item.enabled">
                                            <option value="9:16">9:16 · 竖屏</option>
                                            <option value="16:9">16:9 · 横屏</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small">模型分辨率档位</label>
                                        <select class="form-select form-select-sm" x-model="item.resolutionTier" :disabled="!item.enabled">
                                            <template x-for="tier in item.resolutionOptions" :key="`${item.modelKey}-${tier}`"><option :value="tier" x-text="tier"></option></template>
                                        </select>
                                    </div>
                                    <div class="col-md-2 small text-muted" x-text="item.ratio === '9:16' ? '母版 1080×1920' : '母版 1920×1080'"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </section>

                <div class="visually-hidden" aria-live="polite" x-text="creativeWorkspace.episodeDownload.previewLoading ? '正在生成预览' : (creativeWorkspace.episodeDownload.previewError || creativeWorkspace.episodeDownload.templatesError || '')"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" @click="downloadSelectedEpisodes" :disabled="!creativeWorkspace.episodeDownload.selectedEpisodes.length || (creativeWorkspace.episodeDownload.stage === 'script' && (!creativeWorkspace.episodeDownload.templateId || creativeWorkspace.episodeDownload.templatesLoading))">
                    <i class="bi bi-download me-1"></i><span x-text="episodeDownloadActionLabel()"></span>
                </button>
            </div>
        </div>
    </div>
</div>
