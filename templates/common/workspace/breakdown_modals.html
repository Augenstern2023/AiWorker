<div class="modal fade" id="breakdownGenerationProgressModal" tabindex="-1" data-bs-backdrop="static" aria-labelledby="breakdownGenerationProgressModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title" id="breakdownGenerationProgressModalLabel"><i class="bi bi-diagram-3 me-2"></i>生成剧目拆解</h5>
                        <div class="small text-muted" x-text="breakdownGeneration.topic?.title || ''"></div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="breakdown-generation-model">本次使用模型</label>
                        <select id="breakdown-generation-model" class="form-select"
                                x-model="breakdownGeneration.modelRecordId"
                                @change="selectBreakdownGenerationModel($event.target.value)"
                                :disabled="breakdownGeneration.modelsLoading || breakdownGenerationRunning()">
                            <option value="">使用全局默认模型</option>
                            <template x-for="item in (breakdownGeneration.modelOptions || [])" :key="`breakdown-model-${item.id}`">
                                <option :value="item.id" x-text="item.is_default ? `${item.label}（全局默认）` : item.label"></option>
                            </template>
                        </select>
                        <div class="form-text" x-show="breakdownGeneration.modelsLoading">正在读取可用模型…</div>
                        <div class="form-text" x-show="!breakdownGeneration.modelsLoading">模型使用管理员已保存的提供商 API Key，本次切换无需重新输入。</div>
                    </div>
                    <fieldset class="mb-3"
                              x-show="(breakdownGeneration.reasoningEffortOptions || []).length"
                              :disabled="breakdownGeneration.modelsLoading || breakdownGenerationRunning()">
                        <legend class="form-label fs-6 mb-2">本次推理档位（单选）</legend>
                        <div class="d-flex flex-wrap gap-3" role="radiogroup" aria-label="本次推理档位">
                            <label class="form-check form-check-inline mb-0 me-0">
                                <input id="breakdown-generation-reasoning-effort-default" class="form-check-input" type="radio"
                                       name="breakdown-generation-reasoning-effort" value=""
                                       x-model="breakdownGeneration.reasoningEffort">
                                <span class="form-check-label">模型默认</span>
                            </label>
                            <template x-for="item in (breakdownGeneration.reasoningEffortOptions || [])" :key="`breakdown-effort-${item.value}`">
                                <label class="form-check form-check-inline mb-0 me-0">
                                    <input class="form-check-input" type="radio"
                                           name="breakdown-generation-reasoning-effort"
                                           :id="`breakdown-generation-reasoning-effort-${item.value}`"
                                           :value="item.value"
                                           x-model="breakdownGeneration.reasoningEffort">
                                    <span class="form-check-label" x-text="item.label"></span>
                                </label>
                            </template>
                        </div>
                        <div class="form-text" x-show="(breakdownGeneration.reasoningEffortOptions || []).length">显式选择后将原样发送，不会自动升档或降档。</div>
                    </fieldset>
                    <div class="form-text mb-3" x-show="!breakdownGeneration.modelsLoading && !(breakdownGeneration.reasoningEffortOptions || []).length">当前模型不支持推理档位参数，本次请求不会发送该参数。</div>
                    <div x-show="breakdownGeneration.status !== 'configuring'">
                        <div class="small text-info mb-2" x-show="breakdownGeneration.coverage.length" x-text="breakdownGeneration.requiresTranscription ? `已发现第 ${breakdownGeneration.coverage.join('、')} 集下载视频` : `已加载第 ${breakdownGeneration.coverage.join('、')} 集剧目脚本`"></div>
                        <div class="d-flex justify-content-between small mb-1"><span x-text="breakdownGeneration.message || '正在创建生成任务'"></span><strong x-text="breakdownGenerationProgressLabel()"></strong></div>
                        <div class="progress" role="progressbar" aria-label="拆解生成进度">
                            <div class="progress-bar progress-bar-striped" :class="{'progress-bar-animated': breakdownGenerationRunning(), 'bg-danger': breakdownGeneration.status === 'failed'}" :style="`width: ${breakdownGenerationIndeterminate() ? 100 : breakdownGenerationProgressPercent()}%`"></div>
                        </div>
                    </div>
                    <div class="mt-3 border-top border-secondary pt-3" x-show="breakdownGeneration.showLogs" x-cloak>
                        <div class="d-flex align-items-center justify-content-between mb-1">
                            <small class="fw-semibold"><i class="bi bi-terminal me-1"></i>任务日志</small>
                            <small class="text-muted" x-text="breakdownGeneration.logCount ? `共 ${breakdownGeneration.logCount} 条` : ''"></small>
                        </div>
                        <div id="breakdownGenerationLogPane" class="log-pane" style="height: 220px; font-size: 12px;" x-ref="breakdownGenerationLogPane">
                            <template x-for="(log, i) in breakdownGeneration.logs" :key="i">
                                <div class="log-line" :class="log.includes('[ERROR]') ? 'text-danger' : log.includes('[WARNING]') ? 'text-warning' : ''" x-text="log"></div>
                            </template>
                            <div x-show="!breakdownGeneration.logs || breakdownGeneration.logs.length === 0" class="text-muted p-2">等待日志...</div>
                        </div>
                    </div>
                    <div class="alert alert-danger py-2 mt-3 mb-0" x-show="breakdownGeneration.error" x-text="breakdownGeneration.error"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" x-text="breakdownGenerationRunning() ? '后台运行' : '关闭'"></button>
                    <button type="button" class="btn btn-outline-light" x-show="breakdownGeneration.jobId" @click="openBreakdownTaskLog"><i class="bi bi-list-ul me-1"></i>任务日志</button>
                    <button type="button" class="btn btn-primary" x-show="breakdownGeneration.status === 'configuring'" @click="submitTranscriptBreakdown" :disabled="breakdownGeneration.modelsLoading"><i class="bi bi-play-fill me-1"></i>开始生成</button>
                    <button type="button" class="btn btn-primary" x-show="breakdownGenerationRetryable()" @click="startTranscriptBreakdown(breakdownGeneration.topic, breakdownGeneration.source)"><i class="bi bi-arrow-clockwise me-1"></i>重试</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="breakdownEditorModal" tabindex="-1" aria-labelledby="breakdownEditorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title" id="breakdownEditorModalLabel">爆款拆解编辑</h5>
                        <div class="small text-muted"><span x-text="breakdownEditor.title || '未命名选题'"></span><span class="ms-2" x-text="`v${breakdownEditor.record?.version || 1} · ${breakdownEditor.record?.status || 'draft'}`"></span></div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger py-2" x-show="breakdownEditor.error" x-text="breakdownEditor.error"></div>
                    <div class="row g-3">
                        <template x-for="item in breakdownEditor.fieldGuide" :key="item.key">
                            <div class="col-12 border-bottom border-secondary-subtle pb-3">
                                <div class="d-flex align-items-center justify-content-between gap-2 mb-2"><label class="form-label fw-semibold mb-0" x-text="item.label"></label><span class="badge bg-secondary" x-text="item.type"></span></div>
                                <template x-if="item.type !== '数组'"><textarea class="form-control" rows="3" x-model="breakdownEditor.content[item.key]" :disabled="breakdownEditor.record?.status !== 'draft'"></textarea></template>
                                <template x-if="item.type === '数组'"><div class="vstack gap-2"><template x-for="(entry, index) in breakdownEditor.content[item.key]" :key="`${item.key}-${index}`"><div class="input-group"><textarea class="form-control" rows="2" x-model="breakdownEditor.content[item.key][index]" :disabled="breakdownEditor.record?.status !== 'draft'"></textarea><button type="button" class="btn btn-outline-danger" @click="removeBreakdownArrayItem(item.key, index)" :disabled="breakdownEditor.record?.status !== 'draft'" title="删除此项" aria-label="删除此项"><i class="bi bi-trash"></i></button></div></template><button type="button" class="btn btn-sm btn-outline-light align-self-start" @click="addBreakdownArrayItem(item.key)" :disabled="breakdownEditor.record?.status !== 'draft'" title="添加一项" aria-label="添加一项"><i class="bi bi-plus-lg"></i></button></div></template>
                                <div class="small text-muted mt-2" x-text="item.description"></div>
                                <div class="small text-info mt-1"><span>写法：</span><span x-text="item.writing_prompt"></span></div>
                                <div class="small text-warning mt-1"><span>示例：</span><span x-text="item.example"></span></div>
                                <div class="small text-success mt-1"><span>证据：</span><span x-text="item.evidence_rule"></span></div>
                            </div>
                        </template>
                    </div>
                    <div class="small text-muted mt-2">内容字段来源和风险信息保留在拆解版本中。完成后不可覆盖。<span class="badge text-bg-secondary ms-2" x-text="breakdownRecordStatusLabel(breakdownEditor.record?.status)"></span><span class="visually-hidden">草稿 已完成 已替代</span></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-outline-secondary" @click="downloadBreakdown" :disabled="!breakdownEditor.record?.id"><i class="bi bi-download me-1"></i>下载到本地</button>
                    <button type="button" class="btn btn-outline-info" @click="regenerateCurrentBreakdown" :disabled="breakdownEditor.saving || breakdownGenerationRunning()"><i class="bi bi-arrow-clockwise me-1"></i>更新拆解</button>
                    <button type="button" class="btn btn-outline-light" @click="saveBreakdownEditor" :disabled="breakdownEditor.saving || breakdownEditor.record?.status !== 'draft'"><i class="bi bi-save me-1"></i>保存草稿</button>
                    <button type="button" class="btn btn-warning" @click="submitBreakdownEditor" :disabled="breakdownEditor.saving || breakdownEditor.record?.status !== 'draft'"><i class="bi bi-lock-fill me-1"></i>完成并锁定</button>
                </div>
            </div>
        </div>
    </div>
