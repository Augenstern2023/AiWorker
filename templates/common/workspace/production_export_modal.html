<!-- Shared production package export dialog: included by managed projects and Brief pages. -->
<div class="modal fade" id="productionExportModal" tabindex="-1" aria-labelledby="productionExportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="productionExportModalLabel">导出生产项目包</h5>
                    <div class="small text-muted" id="production-export-project-name" aria-live="polite"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs mb-3" id="production-export-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="production-export-tab-check" type="button"
                                data-bs-toggle="tab" data-bs-target="#production-export-pane-check"
                                role="tab" aria-controls="production-export-pane-check"
                                aria-selected="true">导出检查</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="production-export-tab-history" type="button"
                                data-bs-toggle="tab" data-bs-target="#production-export-pane-history"
                                role="tab" aria-controls="production-export-pane-history"
                                aria-selected="false">历史导出</button>
                    </li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="production-export-pane-check" role="tabpanel"
                         aria-labelledby="production-export-tab-check">
                        <div class="alert alert-secondary small mb-3">可导出全剧或指定集的锁定版本，格式固定为 JSON。导出不等于生产审批，仅打包创作资料。</div>
                        <div class="border rounded p-3 mb-3" id="production-export-version-section">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-5">
                                    <label class="form-label small" for="production-export-version-strategy">版本选择</label>
                                    <select class="form-select form-select-sm" id="production-export-version-strategy">
                                        <option value="current">当前锁定版本（推荐）</option>
                                        <option value="custom">自定义兼容版本</option>
                                    </select>
                                </div>
                                <div class="col-md-7 small text-muted" id="production-export-version-summary">
                                    默认使用项目当前锁定的完整版本链。
                                </div>
                            </div>
                            <div class="alert alert-warning small py-2 mt-2 mb-0 d-none" id="production-export-version-warning" role="alert"></div>
                            <div class="mt-3 d-none" id="production-export-version-controls">
                                <div class="row g-2">
                                    <div class="col-md-4"><label class="form-label small" for="production-export-version-brief">Brief</label><select class="form-select form-select-sm" id="production-export-version-brief"></select></div>
                                    <div class="col-md-4"><label class="form-label small" for="production-export-version-characters">人物关系</label><select class="form-select form-select-sm" id="production-export-version-characters"></select></div>
                                    <div class="col-md-4"><label class="form-label small" for="production-export-version-outline">全剧大纲</label><select class="form-select form-select-sm" id="production-export-version-outline"></select></div>
                                </div>
                                <div class="table-responsive mt-3" id="production-export-episode-version-controls"></div>
                                <div class="small text-muted mt-2">选择上游版本后，下游只会自动采用兼容的已锁定版本；不兼容版本会置灰。</div>
                            </div>
                        </div>
                        <div class="border rounded p-3 mb-3" id="production-export-scope-controls">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label small" for="production-export-scope">导出范围</label>
                                    <select class="form-select form-select-sm" id="production-export-scope">
                                        <option value="all">全剧</option>
                                        <option value="range">连续区间</option>
                                        <option value="custom">自选集数</option>
                                        <option value="available" id="production-export-available-option">当前可用集</option>
                                    </select>
                                </div>
                                <div class="col-md-5 d-none" id="production-export-range-fields">
                                    <div class="d-flex align-items-end gap-2">
                                        <div><label class="form-label small" for="production-export-range-start">开始集</label><input class="form-control form-control-sm" id="production-export-range-start" type="number" min="1" value="1"></div>
                                        <span class="pb-1">至</span>
                                        <div><label class="form-label small" for="production-export-range-end">结束集</label><input class="form-control form-control-sm" id="production-export-range-end" type="number" min="1" value="1"></div>
                                    </div>
                                </div>
                                <div class="col-md-5 d-none" id="production-export-custom-fields">
                                    <label class="form-label small" for="production-export-custom-episodes">集数</label>
                                    <input class="form-control form-control-sm" id="production-export-custom-episodes" placeholder="例如：1-5、8、10">
                                </div>
                                <div class="col-md-3 ms-auto">
                                    <button class="btn btn-sm btn-outline-primary w-100" id="production-export-scope-apply" type="button">检查此范围</button>
                                </div>
                            </div>
                            <div class="small text-muted mt-2" id="production-export-available-summary">正在识别当前可用集…</div>
                            <div class="small text-danger mt-2 d-none" id="production-export-scope-error" role="alert"></div>
                        </div>
                        <div id="production-export-check-status" class="small text-muted" role="status" aria-live="polite">正在执行完整性检查…</div>
                        <div id="production-export-error" class="alert alert-danger d-none" role="alert"></div>
                        <div id="production-export-issues" class="mb-3"></div>
                        <div id="production-export-stages" class="mb-3"></div>
                        <div id="production-export-result" class="alert alert-success d-none" role="status"></div>
                    </div>
                    <div class="tab-pane fade" id="production-export-pane-history" role="tabpanel"
                         aria-labelledby="production-export-tab-history">
                        <div id="production-export-history-status" class="small text-muted" role="status" aria-live="polite">正在加载历史导出…</div>
                        <div id="production-export-history-error" class="alert alert-danger d-none" role="alert"></div>
                        <div class="table-responsive">
                            <table class="table table-sm align-middle">
                                <thead>
                                    <tr>
                                        <th>创建</th>
                                        <th>版本</th>
                                        <th>范围</th>
                                        <th>状态</th>
                                        <th class="text-end">下载</th>
                                    </tr>
                                </thead>
                                <tbody id="production-export-history-list"></tbody>
                            </table>
                        </div>
                        <nav class="d-flex justify-content-between align-items-center" aria-label="历史导出分页">
                            <span id="production-export-history-total" class="small text-muted"></span>
                            <span class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-secondary" id="production-export-history-prev" type="button">上一页</button>
                                <button class="btn btn-sm btn-outline-secondary" id="production-export-history-next" type="button">下一页</button>
                            </span>
                        </nav>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" id="production-export-generate" type="button" disabled>生成生产包</button>
            </div>
        </div>
    </div>
</div>
