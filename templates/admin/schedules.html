{% extends "layouts/base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3"><div><h3 class="mb-1">调度中心</h3><div class="small text-muted">管理本机爬取、榜单更新和素材下载计划</div></div><button class="btn btn-outline-secondary btn-sm" id="schedule-refresh" type="button" title="刷新"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button></div>
<div class="alert alert-danger d-none" id="schedule-error" role="alert"></div>
<form class="border rounded p-3 mb-3" id="schedule-editor"><div class="d-flex align-items-center justify-content-between mb-3"><h5 class="mb-0" id="schedule-editor-title">新建计划</h5><button class="btn btn-outline-secondary btn-sm d-none" id="schedule-editor-cancel" type="button" title="取消编辑"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div><input id="schedule-id" type="hidden"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="schedule-name">计划名称</label><input class="form-control" id="schedule-name" required maxlength="120"></div><div class="col-md-2"><label class="form-label" for="schedule-job-type">任务类型</label><select class="form-select" id="schedule-job-type"><option value="crawl">爬取</option><option value="ranking_update">榜单更新</option><option value="asset_download">素材下载</option></select></div><div class="col-md-2"><label class="form-label" for="schedule-trigger-type">触发器</label><select class="form-select" id="schedule-trigger-type"><option value="cron">Cron</option><option value="date">单次</option></select></div><div class="col-md-2"><label class="form-label" for="schedule-max-retries">失败重试</label><input class="form-control" id="schedule-max-retries" type="number" min="0" max="3" value="3"></div><div class="col-md-2"><label class="form-label" for="schedule-max-concurrent">并发上限</label><input class="form-control" id="schedule-max-concurrent" type="number" min="1" max="8" value="1"></div><div class="col-md-6"><label class="form-label" for="schedule-payload">任务参数 JSON</label><textarea class="form-control font-monospace" id="schedule-payload" rows="3" required>{"platform":"dy","crawler_type":"search"}</textarea></div><div class="col-md-6"><label class="form-label" for="schedule-trigger-config">触发配置 JSON</label><textarea class="form-control font-monospace" id="schedule-trigger-config" rows="3" required>{"hour":"8","minute":"0"}</textarea></div><div class="col-md-4"><label class="form-label" for="schedule-timezone">时区</label><input class="form-control" id="schedule-timezone" value="Asia/Shanghai" required></div><div class="col-md-4 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" id="schedule-enabled" type="checkbox" checked><label class="form-check-label" for="schedule-enabled">创建后立即启用</label></div></div><div class="col-md-4 d-flex align-items-end justify-content-md-end"><button class="btn btn-primary" id="schedule-save" type="submit"><i class="bi bi-save me-1" aria-hidden="true"></i>保存计划</button></div></div></form>
<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>名称</th><th>类型</th><th>触发器</th><th>状态</th><th>重试/并发</th><th>操作</th></tr></thead><tbody id="schedule-list"><tr><td colspan="6" class="text-center text-muted py-4">正在加载计划...</td></tr></tbody></table></div>
<section class="border-top pt-3 mt-4 d-none" id="schedule-history"><div class="d-flex align-items-center justify-content-between mb-2"><h5 class="mb-0" id="schedule-history-title">运行记录</h5><button class="btn btn-outline-secondary btn-sm" id="schedule-history-close" type="button" title="关闭详情"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div><div class="row g-3"><div class="col-lg-8"><div class="table-responsive"><table class="table table-sm"><thead><tr><th>计划时间</th><th>状态</th><th>尝试</th><th>错误摘要</th><th></th></tr></thead><tbody id="schedule-runs"></tbody></table></div></div><div class="col-lg-4"><h6>告警</h6><ul class="list-group list-group-flush" id="schedule-alerts"></ul></div></div></section>
{% endblock %}
{% block scripts %}<script src="/static/js/admin/schedules.js?v={{ asset_version }}"></script>{% endblock %}
