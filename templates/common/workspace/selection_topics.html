<section>
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div>
                    <h3 class="mb-1">选题库</h3>
                    <div class="small text-muted">已采纳的爆款选题，作为后续创作的唯一入口</div>
                </div>
                <button class="btn btn-outline-secondary btn-sm" @click="fetchTopicLibrary()" :disabled="topicLibrary.loading">
                    <i class="bi bi-arrow-clockwise me-1"></i>刷新
                </button>
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-2"><label class="form-label small">平台</label><select class="form-select form-select-sm" x-model="topicLibrary.platform"><option value="">全部平台</option><option value="dy">抖音</option><option value="hg">红果</option></select></div>
                        <div class="col-md-2"><label class="form-label small">进度</label><select class="form-select form-select-sm" x-model="topicLibrary.lifecycleStatus"><option value="">全部进度</option><option value="adopted">待下载</option><option value="pending_download">下载中</option><option value="downloaded">素材已就绪（已下载 X 集）</option><option value="pending_breakdown">待拆解/拆解草稿</option><option value="breakdown_completed">拆解已完成</option><option value="pending_imitation">待仿制</option><option value="imitation_generated">已仿制</option><option value="pending_character_relationships">人物关系待生成</option><option value="character_relationships_generated">人物关系已生成</option><option value="pending_episode_outlines">分集大纲待生成</option><option value="episode_outlines_generated">分集大纲已生成</option><option value="pending_beats">Beats脚本待生成</option><option value="beats_generated">Beats脚本已生成</option><option value="beats_exported">Beats脚本已导出</option></select></div>
                        <div class="col-md-2"><label class="form-label small">题材</label><input class="form-control form-control-sm" x-model="topicLibrary.category" placeholder="筛选题材"></div>
                        <div class="col-md-2"><label class="form-label small">最低推荐分</label><input class="form-control form-control-sm" type="number" min="0" max="100" x-model="topicLibrary.minScore" placeholder="0"></div>
                        <div class="col-md-2"><label class="form-label small">拆解版本</label><select class="form-select form-select-sm" x-model="topicLibrary.hasLocked"><option value="">全部</option><option value="true">已有锁定拆解</option><option value="false">无锁定拆解</option></select></div>
                        <div class="col-md-2 d-grid"><button class="btn btn-primary btn-sm" @click="fetchTopicLibrary()"><i class="bi bi-funnel me-1"></i>应用筛选</button></div>
                    </div>
                </div>
            </div>
            <div class="alert alert-danger" x-show="topicLibrary.error" x-text="topicLibrary.error"></div>
            <div class="d-flex justify-content-between align-items-center mb-2 small text-muted"><span x-text="`共 ${topicLibrary.items.length} 条选题`"></span><span>评分、来源和状态会持续保留</span></div>
            <div class="creative-topic-table">
                <table class="table table-sm table-hover align-middle mb-0">
                    <colgroup>
                        <col class="col-topic">
                        <col class="col-desc">
                        <col class="col-source">
                        <col class="col-rank">
                        <col class="col-category">
                        <col class="col-score">
                        <col class="col-status">
                        <col class="col-breakdown">
                        <col class="col-actions">
                    </colgroup>
                    <thead><tr><th>选题</th><th>简介</th><th>来源</th><th>榜单</th><th>题材</th><th>推荐分 <button type="button" class="btn btn-link btn-sm p-0 text-muted score-help" data-bs-toggle="tooltip" data-bs-placement="top" title="由热度、增长、新鲜度和平台适配加权计算；数据缺失时会动态归一化" aria-label="推荐分计算说明"><i class="bi bi-info-circle"></i></button></th><th>状态</th><th>拆解版本</th><th>操作</th></tr></thead>
                    <tbody>
                        <template x-for="topic in topicLibrary.items" :key="topic.id">
                            <tr>
                                <td><div class="fw-semibold" x-text="topic.title"></div><small class="text-muted" x-text="topic.recommendation || '暂无推荐理由'"></small></td>
                                <td class="topic-desc-cell" :title="topic.description">
                                    <span class="topic-desc-clamp" x-text="topic.description || '暂无简介'"></span>
                                </td>
                                <td><span x-text="(topic.source_platforms || [topic.platform]).join('、')"></span><small class="d-block text-muted" x-text="topic.captured_at || '-' "></small></td>
                                <td x-text="topic.rank_type || '-' "></td>
                                <td x-text="topic.category || '-' "></td>
                                <td><span class="fw-semibold" x-text="Number(topic.score || 0).toFixed(1)"></span></td>
                                <td><template x-if="generatedLifecycleStage(topic.lifecycle_status)"><button type="button" class="badge lifecycle-badge border-0" :class="topicLifecycleClass(topic.lifecycle_status)" @click="openGeneratedContentPreview(topic)" title="预览已生成内容" x-text="topic.lifecycle_label || topicLifecycleLabel(topic)"></button></template><template x-if="!generatedLifecycleStage(topic.lifecycle_status)"><span class="badge lifecycle-badge" :class="topicLifecycleClass(topic.lifecycle_status)" x-text="topic.lifecycle_label || topicLifecycleLabel(topic)"></span></template></td>
                                <td><span class="badge breakdown-version-badge" :class="breakdownStatusClass(topic)" x-text="breakdownStatusLabel(topic)"></span></td>
                                <td class="text-nowrap">
                                    <button class="btn btn-sm btn-outline-primary me-1" x-show="topic.status === 'adopted'" @click="openTopicDownload(topic)" :title="dramaDownloadRunningForTopic(topic.id) ? '查看下载进度' : '下载剧集'" aria-label="下载剧集"><span class="spinner-border spinner-border-sm" x-show="dramaDownloadRunningForTopic(topic.id)"></span><i class="bi bi-download" x-show="!dramaDownloadRunningForTopic(topic.id)"></i></button>
                                    <button class="btn btn-sm btn-outline-secondary me-1" x-show="topic.status === 'adopted' && ((topic.source_platforms || [topic.platform]).includes('hg') || (topic.source_platforms || [topic.platform]).includes('dy'))" @click="openTopicReviewCapture(topic)" :title="dramaReviewActionTitle(topic)" :aria-label="dramaReviewActionTitle(topic)"><span class="spinner-border spinner-border-sm" x-show="dramaReviewRunningForTopic(topic)"></span><i class="bi bi-chat-square-text" x-show="!dramaReviewRunningForTopic(topic)"></i></button>
                                    <button class="btn btn-sm btn-outline-light me-1" x-show="topic.status === 'adopted' && Number(topic.downloaded_episode_count || 0) > 0" @click="createTopicLibraryBreakdown(topic)" :disabled="breakdownJobRunningForTopic(topic.id)" :title="breakdownJobRunningForTopic(topic.id) ? '该剧目正在拆解' : (topic.latest_breakdown_id ? '预览拆解' : '生成拆解')" :aria-label="topic.latest_breakdown_id ? '预览拆解' : '生成拆解'"><span class="spinner-border spinner-border-sm" x-show="breakdownJobRunningForTopic(topic.id)"></span><i class="bi bi-diagram-3" x-show="!breakdownJobRunningForTopic(topic.id)"></i></button>
                                    <button class="btn btn-sm btn-outline-info me-1" x-show="Number(topic.downloaded_episode_count || 0) > 0" @click="openTopicTranscriptPreview(topic)" title="预览剧目转写" aria-label="预览剧目转写"><i class="bi bi-eye"></i></button>
                                    {% if principal.is_system_admin or ('project.manage' in principal.permissions and 'workflow.assign' in principal.permissions) %}
                                    <button class="btn btn-sm btn-outline-success me-1" x-show="topic.locked_breakdown_id && !topic.lifecycle_project_id" @click="openPlanningAssignment(topic)" title="分配创意策划"><i class="bi bi-person-plus"></i></button>
                                    <button class="btn btn-sm btn-outline-success me-1" x-show="workflowAssignmentForStage(topic)" @click="openStageWorkflowAssignment(topic)" :title="workflowAssignmentForStage(topic)?.role_label ? `分配${workflowAssignmentForStage(topic).role_label}` : ''"><i class="bi bi-person-plus"></i></button>
                                    {% endif %}
                                    <button class="btn btn-sm btn-outline-warning" x-show="topic.status === 'adopted'" @click="updateTopicLibrary(topic, 'archived')" title="归档" aria-label="归档"><i class="bi bi-archive"></i></button>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="!topicLibrary.loading && topicLibrary.items.length === 0"><td colspan="9" class="text-center text-muted py-5">暂无符合条件的选题，请先在“今日爆款”生成候选</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
