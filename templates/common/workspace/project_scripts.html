<div id="project-script-workspace">
    <div class="d-flex justify-content-between align-items-end mb-3"><div><h5 class="mb-1">场次剧本</h5><div class="small text-muted">基于已锁定 Beats 生成可拍摄场次与台词</div><div class="small text-muted" x-text="projectScriptsSeriesBlockReason()"></div></div><div class="d-flex gap-2 align-items-end"><div><label class="form-label small">集数</label><input class="form-control form-control-sm" style="width:90px" type="number" min="1" :max="creativeWorkspace.project.target_episode_count" x-model.number="creativeWorkspace.selectedEpisode"></div><button class="btn btn-primary btn-sm" @click="generateProjectScript" :disabled="creativeActionDisabled('script')"><i class="bi bi-magic me-1"></i><span x-text="creativeActionRunning('script') ? '生成中' : projectScriptGenerationActionLabel()"></span></button><button class="btn btn-outline-primary btn-sm" @click="generateProjectScriptsSeries" :disabled="creativeActionDisabled('script', {series: true}) || !canGenerateProjectScriptsSeries()" :title="projectScriptsSeriesBlockReason()"><i class="bi bi-collection-play me-1"></i><span x-text="creativeActionRunning('script') ? '全剧生成中' : seriesGenerationActionLabel('script')"></span></button></div></div>
    <template x-if="selectedProjectScript()"><div><div class="d-flex justify-content-between align-items-center mb-2"><span class="fw-semibold" x-text="`第 ${creativeWorkspace.selectedEpisode} 集 · v${selectedProjectScript().version} · 生成版本`"></span><div class="d-flex gap-2"><button class="btn btn-outline-light btn-sm" @click="saveProjectEpisode(selectedProjectScript())" :disabled="!creativeResourceEditable(selectedProjectScript())"><i class="bi bi-save me-1"></i>保存</button><a class="btn btn-outline-info btn-sm" :href="mergedScriptDownloadUrl()" title="合并下载已生成场次剧本"><i class="bi bi-download me-1"></i>剧本下载</a><a class="btn btn-outline-secondary btn-sm" :href="`/api/creative/projects/${creativeWorkspace.project.id}/generated-content/download?stage=script&resource_id=${selectedProjectScript().id}&format=txt`" title="下载本集 TXT"><i class="bi bi-download me-1"></i>本集下载</a></div></div><div class="mb-3"><label class="form-label small">集标题</label><input class="form-control form-control-sm" x-model="selectedProjectScript().content.episode_title" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><template x-for="scene in selectedProjectScript().content.scenes" :key="`${scene.sequence_no}-${scene.scene_no}`"><div class="border-top py-3"><div class="row g-2"><div class="col-3"><label class="form-label small">段</label><input class="form-control form-control-sm" type="number" min="1" x-model.number="scene.sequence_no" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><div class="col-3"><label class="form-label small">场</label><input class="form-control form-control-sm" type="number" min="1" x-model.number="scene.scene_no" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><div class="col-3"><label class="form-label small">时间</label><input class="form-control form-control-sm" x-model="scene.time_of_day" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><div class="col-3"><label class="form-label small">内外</label><input class="form-control form-control-sm" x-model="scene.interior_exterior" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><div class="col-md-6"><label class="form-label small">场景</label><input class="form-control form-control-sm" x-model="scene.location" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><div class="col-md-3"><label class="form-label small">道具</label><input class="form-control form-control-sm" :value="listText(scene.props)" @input="setListField(scene, 'props', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><div class="col-md-3"><label class="form-label small">出场人物</label><input class="form-control form-control-sm" :value="listText(scene.characters)" @input="setListField(scene, 'characters', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectScript())"></div></div><template x-for="block in scene.blocks"><div class="row g-2 mt-1"><div class="col-md-2"><select class="form-select form-select-sm" x-model="block.type" :disabled="!creativeResourceEditable(selectedProjectScript())"><option value="action">动作</option><option value="dialogue">台词</option><option value="voiceover">画外音</option><option value="inner_voice">内心独白</option><option value="cut">切镜</option></select></div><div class="col-md-2" x-show="['dialogue', 'voiceover', 'inner_voice'].includes(block.type)"><input class="form-control form-control-sm" placeholder="人物" x-model="block.speaker" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><div class="col-md-2" x-show="block.type === 'dialogue'"><input class="form-control form-control-sm" placeholder="情绪" x-model="block.modifier" :disabled="!creativeResourceEditable(selectedProjectScript())"></div><div class="col"><textarea class="form-control form-control-sm" rows="2" x-model="block.text" :disabled="!creativeResourceEditable(selectedProjectScript())"></textarea></div></div></template></div></template></div></template>
    <div class="text-center text-muted py-4" x-show="!selectedProjectScript()" x-text="scriptWorkspaceEmptyMessage()"></div>
</div>
