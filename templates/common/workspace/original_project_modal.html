<div class="modal fade" id="originalProjectModal" tabindex="-1" aria-labelledby="originalProjectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content original-project-modal">
            <div class="modal-header">
                <div><h5 class="modal-title" id="originalProjectModalLabel">创建原创项目</h5><div class="small text-muted mt-1">从一句话开始，AI 会生成 3–5 个差异明显的原创方向。</div></div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label" for="original-seed-text">一句话灵感或题材 <span class="text-danger">*</span></label><textarea id="original-seed-text" class="form-control" rows="4" maxlength="500" x-model="creativeWorkspace.originalCreate.seed_text" placeholder="例如：未来公司按照员工情绪发工资"></textarea><div class="form-text">只需写核心想法；人物、冲突和故事发动机会在方向阶段发散。</div></div>
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label small">项目名称</label><input class="form-control form-control-sm" maxlength="200" x-model="creativeWorkspace.originalCreate.name" placeholder="可暂不填写"></div>
                    <div class="col-md-3"><label class="form-label small">题材</label><input class="form-control form-control-sm" maxlength="100" x-model="creativeWorkspace.originalCreate.genre" placeholder="如都市奇幻"></div>
                    <div class="col-md-3"><label class="form-label small">目标平台</label><select class="form-select form-select-sm" x-model="creativeWorkspace.originalCreate.target_platform"><option value="">待定</option><option value="dy">抖音</option><option value="hg">红果</option></select></div>
                    <div class="col-md-6"><label class="form-label small">目标受众</label><input class="form-control form-control-sm" maxlength="500" x-model="creativeWorkspace.originalCreate.target_audience" placeholder="如 18–35 岁职场观众"></div>
                    <div class="col-md-3"><label class="form-label small">目标集数</label><input class="form-control form-control-sm" type="number" min="1" max="100" x-model.number="creativeWorkspace.originalCreate.target_episode_count"></div>
                    <div class="col-md-3"><label class="form-label small">秒/集</label><input class="form-control form-control-sm" type="number" min="30" max="1800" x-model.number="creativeWorkspace.originalCreate.episode_duration_seconds"></div>
                    <div class="col-md-4"><label class="form-label small">制作成本</label><select class="form-select form-select-sm" x-model="creativeWorkspace.originalCreate.cost_level"><option value="">待定</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></div>
                    <div class="col-md-8"><label class="form-label small">内容边界</label><textarea class="form-control form-control-sm" rows="2" :value="listText(creativeWorkspace.originalCreate.content_boundaries)" @input="setOriginalBoundaries($event.target.value)" placeholder="每行一条，例如：不美化职场霸凌"></textarea></div>
                </div>
                <details class="mt-3 original-reference-panel"><summary>可选市场参考</summary><p class="small text-muted mt-2 mb-2">仅提取受众、情绪曲线和制作难度等市场信号，不作为改编来源。</p><div class="original-reference-list"><template x-for="topic in creativeWorkspace.eligibleTopics" :key="`original-ref-topic-${topic.id}`"><div class="original-reference-item"><label class="form-check"><input class="form-check-input" type="checkbox" :aria-label="`使用《${topic.title}》选题作为市场参考`" @change="toggleOriginalReference('topic', topic.id, $event.target.checked)"><span class="form-check-label" x-text="`${topic.title} · 已采纳选题`"></span></label><template x-if="topic.locked_breakdown_id"><label class="form-check ms-3"><input class="form-check-input" type="checkbox" :aria-label="`使用《${topic.title}》的锁定拆解 v${topic.locked_breakdown_version || 1}`" @change="toggleOriginalReference('breakdown', topic.locked_breakdown_id, $event.target.checked)"><span class="form-check-label" x-text="`锁定拆解 v${topic.locked_breakdown_version || 1}`"></span></label></template></div></template></div></details>
                <div class="alert alert-danger py-2 mt-3 mb-0" x-show="creativeWorkspace.originalCreate.error" x-text="creativeWorkspace.originalCreate.error" role="alert"></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary" @click="createOriginalProject" :disabled="creativeWorkspace.originalCreate.saving || !creativeWorkspace.originalCreate.seed_text.trim()"><span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.originalCreate.saving"></span>创建并生成方向</button></div>
        </div>
    </div>
</div>
