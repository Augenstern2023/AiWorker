{% extends "layouts/base.html" %}

{% block content %}
<header class="workspace-page-header">
    <div class="workspace-page-header__copy"><div class="workspace-page-header__eyebrow">Writing</div><h3 class="mb-1">编剧项目</h3><div class="small text-muted">我参与编剧的创作项目，创建后自动陈列</div></div>
    <div class="workspace-page-header__actions"><button class="btn btn-outline-secondary btn-sm" @click="fetchCreativeProjects()" title="刷新项目"><i class="bi bi-arrow-clockwise"></i></button></div>
</header>
<section class="workspace-context-bar" aria-label="编剧项目上下文"><div class="workspace-context-bar__primary"><div class="workspace-section-label">项目工作台</div><div class="small text-muted">选择项目后继续全剧大纲、单集 Beats 与场次剧本的创作流程。</div></div><div class="workspace-context-bar__meta"><span class="badge text-bg-secondary">编剧</span><span x-text="`${creativeWorkspace.projects.length} 个项目`"></span></div></section>
{% set show_topic_creation = false %}
{% include "common/workspace/project_list.html" %}
{% endblock %}
{% block scripts %}<script src="/static/js/common/creative.js?v={{ asset_version }}"></script>{% endblock %}
