<header class="workspace-page-header">
    <div class="workspace-page-header__copy">
        <div class="workspace-page-header__eyebrow">Workspace · Tasks</div>
        <h3 class="mb-1" id="task-workspace-title">我的工作台</h3>
        <div class="small text-muted">集中处理项目下一步动作，并掌握创作进度</div>
    </div>
    <div class="workspace-page-header__actions"><button class="btn btn-outline-secondary btn-sm" id="refresh-my-tasks" title="刷新" aria-label="刷新项目列表"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i>刷新</button></div>
</header>
<section class="workspace-context-bar" aria-label="我的工作台上下文">
    <div class="workspace-context-bar__primary"><div class="workspace-section-label">Operate / Monitor</div><div class="small text-muted">按项目名称、来源选题和当前状态筛选；每张卡片保留下一步与更多操作。</div></div>
    <div class="workspace-context-bar__meta"><span>刷新可重新加载项目状态</span></div>
</section>
<div id="my-tasks-error" class="workspace-state workspace-state--error d-none mb-3" role="alert" aria-live="assertive"></div>

<section class="task-workspace" aria-labelledby="task-workspace-title">
    <div id="task-summary" class="task-summary-grid" aria-live="polite">
        <div class="task-summary-item">
            <span class="task-summary-label">需处理</span>
            <strong class="task-summary-value" id="task-summary-action">0</strong>
        </div>
        <div class="task-summary-item">
            <span class="task-summary-label">进行中</span>
            <strong class="task-summary-value" id="task-summary-running">0</strong>
        </div>
        <div class="task-summary-item">
            <span class="task-summary-label">已完成</span>
            <strong class="task-summary-value" id="task-summary-done">0</strong>
        </div>
    </div>
    <div class="workspace-toolbar task-toolbar" role="search" aria-label="项目筛选">
        <div class="workspace-toolbar__group"><label class="visually-hidden" for="task-search">搜索项目</label><input id="task-search" class="form-control" type="search" placeholder="搜索项目或来源选题"></div>
        <div class="workspace-toolbar__group workspace-toolbar__group--compact"><label class="visually-hidden" for="task-status-filter">筛选状态</label><select id="task-status-filter" class="form-select"><option value="all">全部状态</option><option value="action">需处理</option><option value="running">进行中</option><option value="done">已完成</option></select></div>
    </div>
    <div class="workspace-list-pane">
        <div class="workspace-list-pane__header"><div><div class="workspace-section-label">项目列表</div><strong>待处理项目</strong></div><span class="small text-muted">筛选结果会即时更新</span></div>
        <div class="workspace-list-pane__body">
            <div id="my-project-list" class="task-card-grid" aria-busy="true" aria-live="polite">
                <div id="my-tasks-skeleton" class="task-card task-card-skeleton workspace-state workspace-state--loading" role="status">
                    <span class="visually-hidden">正在加载项目列表</span>
                    <div class="ui-skeleton task-skeleton-title"></div>
                    <div class="ui-skeleton task-skeleton-line"></div>
                    <div class="ui-skeleton task-skeleton-line task-skeleton-line-short"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="project-edit-modal" tabindex="-1" aria-labelledby="project-edit-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="project-edit-form">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="project-edit-modal-title">编辑项目</h5>
                    <div class="small text-muted" id="project-edit-name"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="project-edit-id">
                <div class="mb-3">
                    <label class="form-label" for="project-edit-genre">题材</label>
                    <input class="form-control" id="project-edit-genre" maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="project-edit-platform">目标平台</label>
                    <input class="form-control" id="project-edit-platform" maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="project-edit-audience">目标受众</label>
                    <input class="form-control" id="project-edit-audience" maxlength="200">
                </div>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label class="form-label" for="project-edit-episode-count">目标集数</label>
                        <input class="form-control" id="project-edit-episode-count" type="number" min="1" max="100" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="project-edit-duration">单集时长（秒）</label>
                        <input class="form-control" id="project-edit-duration" type="number" min="30" max="1800" required>
                    </div>
                </div>
                <div class="form-text mt-3">已锁定 Brief 的项目不能再修改这些创作参数。</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" id="project-edit-submit" type="submit">保存</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="project-delete-modal" tabindex="-1" aria-labelledby="project-delete-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="project-delete-modal-title">删除项目</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">确定删除项目“<strong id="project-delete-name"></strong>”吗？</p>
                <p class="mb-0 text-danger">删除后将同时清除仿写方向、Brief、人物关系、大纲、Beats、场次剧本、审核与优化草稿，且无法恢复。</p>
                <input type="hidden" id="project-delete-id">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="project-delete-submit">确认删除</button>
            </div>
        </div>
    </div>
</div>
