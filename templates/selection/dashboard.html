{% extends "layouts/base.html" %}

{% block page_header %}
<div class="d-flex align-items-center justify-content-between mb-3">
    <div>
        <h3 class="mb-1">选品工作概览</h3>
        <div class="small text-muted">榜单、候选选题、采纳进度与项目状态</div>
    </div>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="/selection/ranks">
            <i class="bi bi-trophy me-1"></i>今日榜单
        </a>
        <a class="btn btn-primary btn-sm" href="/selection/hits">
            <i class="bi bi-stars me-1"></i>今日爆款
        </a>
    </div>
</div>
{% endblock %}

{% block content %}
<div id="selection-dashboard" data-can-read-analytics="{{ 'true' if principal.is_system_admin or 'analytics.read' in principal.permissions else 'false' }}">
<div class="row g-3" id="dashboard-overview-section" aria-live="polite" aria-atomic="true">
    <div class="col-md-4">
        <div class="card metric-card">
            <div class="card-body">
                <div class="small text-muted">候选选题</div>
                <div class="display-6 ui-skeleton" style="width:60px;height:36px;" id="stat-candidates" role="text" aria-label="候选选题数量加载中"></div>
                <div class="small"><a href="/selection/hits" class="text-reset">前往今日爆款 →</a></div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card metric-card">
            <div class="card-body">
                <div class="small text-muted">选题库</div>
                <div class="display-6 ui-skeleton" style="width:60px;height:36px;" id="stat-library" role="text" aria-label="选题库数量加载中"></div>
                <div class="small"><a href="/selection/topics" class="text-reset">前往选题库 →</a></div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card metric-card">
            <div class="card-body">
                <div class="small text-muted">已采纳选题</div>
                <div class="display-6 ui-skeleton" style="width:60px;height:36px;" id="stat-adopted" role="text" aria-label="已采纳选题数量加载中"></div>
            </div>
        </div>
    </div>
</div>
<div class="row g-3 mt-1">
    <div class="col-md-3">
        <div class="card metric-card">
            <div class="card-body">
                <div class="small text-muted">已同步剧目</div>
                <div class="metric-value ui-skeleton" style="width:40px;height:28px;" id="stat-drama-count" role="text" aria-label="已同步剧目数量加载中"></div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card metric-card">
            <div class="card-body">
                <div class="small text-muted">已采集评论</div>
                <div class="metric-value ui-skeleton" style="width:40px;height:28px;" id="stat-comment-count" role="text" aria-label="已采集评论数量加载中"></div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card metric-card">
            <div class="card-body">
                <div class="small text-muted">已转写素材</div>
                <div class="metric-value ui-skeleton" style="width:40px;height:28px;" id="stat-transcript-count" role="text" aria-label="已转写素材数量加载中"></div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card metric-card">
            <div class="card-body">
                <div class="small text-muted">分析任务</div>
                <div class="metric-value ui-skeleton" style="width:40px;height:28px;" id="stat-task-count" role="text" aria-label="分析任务数量加载中"></div>
            </div>
        </div>
    </div>
</div>
<div id="dashboard-error" class="alert alert-danger d-none mt-3" role="alert"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/selection/topics.js?v={{ asset_version }}"></script>
<script src="/static/js/selection/dashboard.js?v={{ asset_version }}"></script>
{% endblock %}
