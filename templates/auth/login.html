<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - AiWorker</title>
  <link href="/static/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand" aria-label="AiWorker">
      <div class="auth-brand-mark"><i class="bi bi-robot" aria-hidden="true"></i></div>
      <div>
        <div class="auth-product-name">AiWorker</div>
        <p class="auth-product-subtitle">壹凡短剧选品平台</p>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-form-wrap">
        <div class="auth-heading">
          <span class="auth-kicker">本地账号</span>
          <h1>登录工作台</h1>
          <p>输入账号信息继续访问。</p>
        </div>
        <p id="register-notice" class="auth-notice" role="status" hidden></p>
        <form id="login-form" class="auth-form">
          <div>
            <label class="form-label" for="username">用户名</label>
            <div class="auth-input-wrap">
              <i class="bi bi-person" aria-hidden="true"></i>
              <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
            </div>
          </div>
          <div>
            <label class="form-label" for="password">密码</label>
            <div class="auth-input-wrap">
              <i class="bi bi-lock" aria-hidden="true"></i>
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
          </div>
          <p id="error" class="auth-error" role="alert" aria-live="polite"></p>
          <button class="btn btn-primary auth-submit" type="submit">
            <span>登录</span><i class="bi bi-arrow-right" aria-hidden="true"></i>
          </button>
          <p class="auth-switch">还没有账号？<a href="/register">注册账号</a></p>
        </form>
      </div>
    </section>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).get('registered') === '1') {
      const notice = document.getElementById('register-notice');
      notice.textContent = '注册申请已提交，请等待管理员激活。';
      notice.hidden = false;
    }

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button[type="submit"]');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';
      const values = new FormData(event.currentTarget);
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(Object.fromEntries(values)),
        });
        const result = await response.json();
        if (response.ok) window.location.assign(result.landing_route);
        else error.textContent = result.detail || '登录失败';
      } catch (_) {
        error.textContent = '暂时无法连接服务，请稍后重试';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
