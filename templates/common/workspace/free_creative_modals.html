<div class="modal fade" id="sequentialGenerationModelModal" tabindex="-1" aria-labelledby="sequentialGenerationModelModalLabel" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="sequentialGenerationModelModalLabel" x-text="`${creativeActionLabel(creativeWorkspace.sequentialGeneration.pending?.action)} · 本次生成`"></h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
            <label class="form-label" for="sequentialGenerationRunModel">本次使用模型</label>
            <select id="sequentialGenerationRunModel" class="form-select" x-model="creativeWorkspace.sequentialGeneration.modelRecordId" :disabled="creativeWorkspace.sequentialGeneration.loading">
                <option value="">使用全局默认模型</option>
                <template x-for="item in (creativeWorkspace.sequentialGeneration.modelOptions || [])" :key="`run-model-${item.id}`">
                    <option :value="item.id" x-text="item.is_default ? `${item.label}（全局默认）` : item.label"></option>
                </template>
            </select>
            <div class="small text-muted mt-2">仅影响这次生成，下次仍由你选择。</div>
            <div class="small text-muted mt-2" x-show="creativeWorkspace.sequentialGeneration.loading">正在读取可用模型…</div>
            <div class="small text-danger mt-2" role="alert" x-show="creativeWorkspace.sequentialGeneration.error" x-text="creativeWorkspace.sequentialGeneration.error"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-primary" @click="submitSequentialGeneration" :disabled="creativeWorkspace.sequentialGeneration.loading || !creativeWorkspace.sequentialGeneration.pending">开始生成</button>
        </div>
    </div></div>
</div>

<div class="modal fade" id="freeCreativeGenerationModal" tabindex="-1" aria-labelledby="freeCreativeGenerationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div><h5 class="modal-title" id="freeCreativeGenerationModalLabel">自由生成 <span x-text="creativeWorkspace.freeGeneration.series ? (creativeWorkspace.freeGeneration.stage === 'script' ? '全剧场次剧本' : '全剧 Beats') : freeStageLabel(creativeWorkspace.freeGeneration.stage)"></span></h5><div class="small text-muted mt-1" x-text="creativeWorkspace.freeGeneration.series ? '一次生成项目全部集内容，每集独立保存新版本；项目种子始终参与生成。' : '项目种子始终参与生成；以下锁定资源均为可选引用，默认不选择。'"></div></div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">本次使用模型</label><select class="form-select" x-model="creativeWorkspace.freeGeneration.modelRecordId" :disabled="creativeWorkspace.freeGeneration.loading"><option value="">使用全局默认模型</option><template x-for="item in (creativeWorkspace.freeGeneration.modelOptions || [])" :key="item.id"><option :value="item.id" x-text="item.is_default ? `${item.label}（全局默认）` : item.label"></option></template></select><div class="form-text">模型凭据由服务启动环境提供，本次切换无需重新输入。</div></div>
                <div class="mb-3" x-show="creativeWorkspace.freeGeneration.stage === 'brief'"><label class="form-label">本次生成方向数</label><select class="form-select" x-model.number="creativeWorkspace.freeGeneration.count"><option :value="1">1</option><option :value="2">2</option><option :value="3">3</option><option :value="4">4</option><option :value="5">5</option></select><div class="form-text">每个方向单独保存，已有方向继续保留。</div></div>
                <div class="mb-3"><label class="form-label">本次生成指令（可选）</label><textarea class="form-control" rows="3" maxlength="2000" x-model="creativeWorkspace.freeGeneration.instruction" placeholder="例如：强化悬疑感，但保持低成本场景"></textarea></div>
                <div class="row g-3" x-show="!creativeWorkspace.freeGeneration.loading">
                    <template x-if="freeContextFieldAllowed('brief_id')"><div class="col-md-6"><label class="form-label small">锁定 Brief</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.freeGeneration.contextRefs.brief_id"><option :value="null">不引用</option><template x-for="item in (creativeWorkspace.freeGeneration.contextOptions.briefs || [])" :key="`context-brief-${item.id}`"><option :value="item.id" x-text="`v${item.version} · ${item.content?.title || 'Brief'}`"></option></template></select></div></template>
                    <template x-if="freeContextFieldAllowed('character_batch_id')"><div class="col-md-6"><label class="form-label small">锁定人物版本</label><select class="form-select form-select-sm" x-model="creativeWorkspace.freeGeneration.contextRefs.character_batch_id"><option value="">不引用</option><template x-for="item in (creativeWorkspace.freeGeneration.contextOptions.character_batches || [])" :key="`context-characters-${item.batch_id}`"><option :value="item.batch_id" x-text="`v${item.version} · ${(item.characters || []).map(value => value.content?.name).filter(Boolean).slice(0, 3).join('、') || '人物版本'}`"></option></template></select></div></template>
                    <template x-if="freeContextFieldAllowed('outline_batch_id')"><div class="col-md-6"><label class="form-label small">锁定全剧大纲</label><select class="form-select form-select-sm" x-model="creativeWorkspace.freeGeneration.contextRefs.outline_batch_id"><option value="">不引用</option><template x-for="item in (creativeWorkspace.freeGeneration.contextOptions.outline_batches || [])" :key="`context-outline-${item.batch_id}`"><option :value="item.batch_id" x-text="`v${item.version} · ${item.episodes?.length || 0} 集`"></option></template></select></div></template>
                    <template x-if="freeContextFieldAllowed('beats_id')"><div class="col-md-6"><label class="form-label small">当前集锁定 Beats</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.freeGeneration.contextRefs.beats_id"><option :value="null">不引用</option><template x-for="item in (creativeWorkspace.freeGeneration.contextOptions.beats || [])" :key="`context-beats-${item.id}`"><option :value="item.id" x-text="`第 ${item.episode_number} 集 · v${item.version}`"></option></template></select></div></template>
                </div>
                <div class="d-flex align-items-center gap-2 text-muted" x-show.important="creativeWorkspace.freeGeneration.loading" x-cloak role="status" aria-live="polite"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>正在读取生成配置</div>
                <div class="alert alert-danger py-2 mt-3 mb-0" x-show="creativeWorkspace.freeGeneration.error" x-text="creativeWorkspace.freeGeneration.error" role="alert"></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary" @click="submitFreeCreativeGeneration" :disabled="creativeWorkspace.freeGeneration.loading || creativeWorkspace.freeGeneration.submitting"><span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.freeGeneration.submitting"></span>开始生成</button></div>
        </div>
    </div>
</div>

<div class="modal fade" id="creativeModeMigrationModal" tabindex="-1" aria-labelledby="creativeModeMigrationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
        <div class="modal-header"><div><h5 class="modal-title" id="creativeModeMigrationModalLabel">创建自由创作副本</h5><div class="small text-muted mt-1">将新建一个自由创作项目并复制当前已保存内容，原标准流程项目完整保留。</div></div><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button></div>
        <div class="modal-body">
            <div class="d-flex align-items-center gap-2 text-muted" x-show.important="creativeWorkspace.modeMigration.loading" x-cloak role="status" aria-live="polite"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>正在执行迁移预检</div>
            <template x-if="creativeWorkspace.modeMigration.preview"><div>
                <div class="row g-2 mb-3"><template x-for="(count, stage) in (creativeWorkspace.modeMigration.preview.resource_counts || {})" :key="`migration-count-${stage}`"><div class="col"><div class="border rounded p-2 text-center"><div class="small text-muted" x-text="freeStageLabel(stage)"></div><div class="fw-semibold" x-text="count"></div></div></div></template></div>
                <div class="small text-muted mb-3">仅复制已保存内容；原标准流程项目和任务保持不变。</div>
                <div class="alert alert-warning py-2" x-show="(creativeWorkspace.modeMigration.preview.blockers || []).length"><div class="fw-semibold mb-1">当前不能迁移</div><ul class="mb-0"><template x-for="item in creativeWorkspace.modeMigration.preview.blockers" :key="item"><li x-text="item"></li></template></ul></div>
                <label class="form-check"><input class="form-check-input" type="checkbox" x-model="creativeWorkspace.modeMigration.confirmed"><span class="form-check-label">我确认创建独立的自由创作副本</span></label>
            </div></template>
            <div class="alert alert-danger py-2 mt-3 mb-0" x-show="creativeWorkspace.modeMigration.error" role="alert"><span x-text="creativeWorkspace.modeMigration.error"></span><button class="btn btn-sm btn-outline-danger ms-2" type="button" @click="retryCreativeModeMigrationPreview" :disabled="creativeWorkspace.modeMigration.loading">重试预检</button></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-info" @click="migrateCreativeProjectToFree" :disabled="creativeWorkspace.modeMigration.loading || creativeWorkspace.modeMigration.submitting || !creativeWorkspace.modeMigration.confirmed || !creativeWorkspace.modeMigration.preview?.can_migrate"><span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.modeMigration.submitting"></span>确认创建</button></div>
    </div></div>
</div>
