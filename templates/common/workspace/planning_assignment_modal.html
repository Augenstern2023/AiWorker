<div class="modal fade" id="planningAssignmentModal" tabindex="-1" aria-labelledby="planningAssignmentModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div><h2 class="modal-title fs-5" id="planningAssignmentModalTitle">创建项目及任务</h2><div class="small text-muted" x-text="planningAssignment.topic?.title || ''"></div></div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger" x-show="planningAssignment.error" x-text="planningAssignment.error"></div>
                <template x-if="planningAssignment.result">
                    <div>
                        <div class="alert alert-success"><i class="bi bi-check-circle me-1"></i>项目及任务已创建，当前账户已设为项目负责人。</div>
                        <div class="border-top border-bottom py-3"><div class="small text-muted">项目</div><div class="fw-semibold" x-text="planningAssignment.result.project.name"></div><div class="small text-muted mt-2" x-text="`已创建 ${planningAssignment.result.tasks?.length || 0} 个阶段任务`"></div></div>
                    </div>
                </template>
                <div x-show="!planningAssignment.result">
                    <div class="mb-3"><label class="form-label" for="planning-project-name">项目名称</label><input class="form-control" id="planning-project-name" x-model="planningAssignment.name"></div>
                    <div class="row g-3 mb-3"><div class="col-6"><label class="form-label" for="planning-target-platform">目标平台</label><select class="form-select" id="planning-target-platform" x-model="planningAssignment.targetPlatform"><option value="">待定</option><option value="dy">抖音</option><option value="hg">红果</option></select></div><div class="col-6"><label class="form-label" for="planning-episode-count">目标集数</label><input class="form-control" id="planning-episode-count" type="number" min="1" max="100" x-model.number="planningAssignment.targetEpisodeCount"></div></div>
                    <div class="mb-3">
                        <label class="form-label" for="planning-project-owner">项目负责人</label>
                        <input class="form-control bg-body-tertiary" id="planning-project-owner" value="{{ principal.display_name }}（{{ principal.username }}）" readonly>
                        <div class="form-text">创建后自动绑定当前账户，无需选择团队成员。</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" x-show="!planningAssignment.result" @click="submitCreateProject" :disabled="planningAssignment.saving || !planningAssignment.name.trim()"><span class="spinner-border spinner-border-sm me-1" x-show="planningAssignment.saving"></span><i class="bi bi-folder-plus me-1" x-show="!planningAssignment.saving"></i>创建项目及任务</button>
                <button type="button" class="btn btn-primary" x-show="planningAssignment.result" @click="openCreatedProject"><i class="bi bi-folder2-open me-1"></i>打开项目</button>
            </div>
        </div>
    </div>
</div>
