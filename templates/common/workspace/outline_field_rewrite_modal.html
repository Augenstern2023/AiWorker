<div class="modal fade" id="outlineFieldRewriteModal" tabindex="-1" aria-labelledby="outlineFieldRewriteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content outline-field-rewrite-modal">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="outlineFieldRewriteModalLabel">AI 重写第 <span x-text="creativeWorkspace.outlineFieldRewrite?.episodeNumber || ''"></span> 集 · <span x-text="creativeWorkspace.outlineFieldRewrite?.fieldLabel || ''"></span></h5>
                    <div class="small text-muted">每次只生成当前字段；采用前可继续编辑候选内容。</div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" @click="resetOutlineFieldRewrite" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <div class="form-label">当前内容</div>
                    <div class="outline-field-rewrite-source" x-text="creativeWorkspace.outlineFieldRewrite?.sourceText || '暂无内容'"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="outlineFieldRewriteInstruction">修改要求 <span class="text-muted fw-normal">（可选）</span></label>
                    <textarea class="form-control" id="outlineFieldRewriteInstruction" rows="3" maxlength="2000" x-model="creativeWorkspace.outlineFieldRewrite.instruction" :disabled="creativeWorkspace.outlineFieldRewrite.loading || creativeWorkspace.outlineFieldRewrite.applying" placeholder="例如：强化危险感，但保留既定事件和人物动机"></textarea>
                </div>
                <div class="mb-2" x-show="creativeWorkspace.outlineFieldRewrite.candidateText || creativeWorkspace.outlineFieldRewrite.loading" x-cloak>
                    <label class="form-label" for="outlineFieldRewriteCandidate">AI 候选新稿</label>
                    <textarea class="form-control outline-field-rewrite-candidate" id="outlineFieldRewriteCandidate" rows="7" maxlength="6000" x-model="creativeWorkspace.outlineFieldRewrite.candidateText" :disabled="creativeWorkspace.outlineFieldRewrite.loading || creativeWorkspace.outlineFieldRewrite.applying"></textarea>
                </div>
                <div class="small text-muted" aria-live="polite" x-show="creativeWorkspace.outlineFieldRewrite.loading"><span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>正在生成当前字段的新稿…</div>
                <div class="alert alert-danger mt-3 mb-0" role="alert" x-show="creativeWorkspace.outlineFieldRewrite.error" x-text="creativeWorkspace.outlineFieldRewrite.error" x-cloak></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" @click="resetOutlineFieldRewrite" :disabled="creativeWorkspace.outlineFieldRewrite.loading || creativeWorkspace.outlineFieldRewrite.applying">取消</button>
                <button type="button" class="btn btn-outline-primary" @click="requestOutlineFieldRewrite" :disabled="creativeWorkspace.outlineFieldRewrite.loading || creativeWorkspace.outlineFieldRewrite.applying"><span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.outlineFieldRewrite.loading" aria-hidden="true"></span><span x-text="creativeWorkspace.outlineFieldRewrite.candidateText ? '重新生成' : '生成新稿'"></span></button>
                <button type="button" class="btn btn-primary" @click="applyOutlineFieldRewrite" x-show="creativeWorkspace.outlineFieldRewrite.candidateText" :disabled="creativeWorkspace.outlineFieldRewrite.loading || creativeWorkspace.outlineFieldRewrite.applying || !String(creativeWorkspace.outlineFieldRewrite.candidateText || '').trim()"><span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.outlineFieldRewrite.applying" aria-hidden="true"></span>采用新稿</button>
            </div>
        </div>
    </div>
</div>
