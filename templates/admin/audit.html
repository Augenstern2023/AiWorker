{% extends "layouts/base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3"><div><h3 class="mb-1">审计日志</h3><div class="small text-muted">查询关键操作、操作者和结果</div></div><button class="btn btn-outline-secondary btn-sm" id="refresh-audit" title="刷新"><i class="bi bi-arrow-clockwise"></i></button></div>
<form class="row g-3 mb-3" id="audit-filters">
    <div class="col-md-3"><label class="form-label form-label-sm mb-1" for="audit-actor">操作人</label><select class="form-select form-select-sm" id="audit-actor" name="actor_user_id" aria-describedby="audit-actor-help"><option value="">全部操作人</option></select><div class="form-text" id="audit-actor-help">按执行操作的账号筛选。</div></div>
    <div class="col-md-3"><label class="form-label form-label-sm mb-1" for="audit-project">项目</label><select class="form-select form-select-sm" id="audit-project" name="project_id" aria-describedby="audit-project-help"><option value="">全部项目</option></select><div class="form-text" id="audit-project-help">仅显示已产生审计记录的项目。</div></div>
    <div class="col-md-3"><label class="form-label form-label-sm mb-1" for="audit-action">操作类型</label><select class="form-select form-select-sm" id="audit-action" name="action" aria-describedby="audit-action-help"><option value="">全部操作类型</option></select><div class="form-text" id="audit-action-help">选择具体业务事件，例如登录、部门或调度操作。</div></div>
    <div class="col-md-3"><label class="form-label form-label-sm mb-1" for="audit-result">执行结果</label><select class="form-select form-select-sm" id="audit-result" name="result" aria-describedby="audit-result-help"><option value="">全部结果</option><option value="success">成功</option><option value="failure">失败</option></select><div class="form-text" id="audit-result-help">按成功或失败的执行结果筛选。</div></div>
    <div class="col-md-3"><label class="form-label form-label-sm mb-1" for="audit-target-type">资源类型</label><select class="form-select form-select-sm" id="audit-target-type" name="target_type" aria-describedby="audit-target-type-help"><option value="">全部资源类型</option></select><div class="form-text" id="audit-target-type-help">可选；选择后会缩小具体资源范围。</div></div>
    <div class="col-md-3"><label class="form-label form-label-sm mb-1" for="audit-target-id">具体资源</label><select class="form-select form-select-sm" id="audit-target-id" name="target_id" aria-describedby="audit-target-id-help"><option value="">全部具体资源</option></select><div class="form-text" id="audit-target-id-help">可直接选择；资源类型和项目会进一步缩小列表。</div></div>
    <div class="col-md-2"><label class="form-label form-label-sm mb-1" for="audit-created-from">开始时间</label><input class="form-control form-control-sm" id="audit-created-from" name="created_from" type="datetime-local" aria-describedby="audit-created-from-help"><div class="form-text" id="audit-created-from-help">包含此时间。</div></div>
    <div class="col-md-2"><label class="form-label form-label-sm mb-1" for="audit-created-to">结束时间</label><input class="form-control form-control-sm" id="audit-created-to" name="created_to" type="datetime-local" aria-describedby="audit-created-to-help"><div class="form-text" id="audit-created-to-help">不包含此时间。</div></div>
    <div class="col-md-2 d-flex align-items-end gap-2"><button class="btn btn-primary btn-sm" type="submit">筛选</button><button class="btn btn-outline-secondary btn-sm" id="export-audit-csv" type="button"><i class="bi bi-download me-1"></i>CSV</button><button class="btn btn-outline-secondary btn-sm" id="export-audit-xlsx" type="button"><i class="bi bi-download me-1"></i>XLSX</button></div>
</form>
<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>时间</th><th>操作者</th><th>操作类型</th><th>资源</th><th>结果</th></tr></thead><tbody id="audit-list"><tr id="audit-list-skeleton" aria-hidden="true"><td colspan="5"><div class="ui-skeleton" style="height:20px;width:80%;margin:6px 0;"></div><div class="ui-skeleton" style="height:14px;width:50%;"></div></td></tr></tbody></table></div>
<div class="d-flex justify-content-between align-items-center mb-3" id="audit-pagination"><span class="small text-muted" id="audit-total">共 0 条</span><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" id="audit-previous" type="button" title="上一页"><i class="bi bi-chevron-left" aria-hidden="true"></i></button><button class="btn btn-outline-secondary" id="audit-next" type="button" title="下一页"><i class="bi bi-chevron-right" aria-hidden="true"></i></button></div></div>
<aside class="border-top pt-3 d-none" id="audit-details"><div class="d-flex justify-content-between align-items-center mb-2"><h5 class="mb-0">审计详情</h5><button class="btn btn-sm btn-outline-secondary" id="audit-details-close" type="button" title="关闭"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div><dl class="row small mb-0" id="audit-details-fields"></dl></aside>
{% endblock %}
{% block scripts %}<script src="/static/js/admin/audit.js?v={{ asset_version }}&audit_ui=2"></script>{% endblock %}
