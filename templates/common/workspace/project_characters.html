<div>
                    <div class="d-flex justify-content-between align-items-center mb-3"><div><h5 class="mb-1">人物与关系 <span class="badge text-bg-secondary" x-text="creativeWorkflowStatusLabel(currentCharacterBatchStatus())"></span></h5><div class="small text-muted">生成后可逐字段编辑；完成并锁定后供下一阶段使用</div></div><div class="d-flex gap-2"><button class="btn btn-primary btn-sm" @click="generateProjectCharacters" :disabled="creativeActionDisabled('characters')"><span class="spinner-border spinner-border-sm me-1" x-show="creativeActionRunning('characters')"></span><i class="bi bi-people me-1" x-show="!creativeActionRunning('characters')"></i><span x-text="creativeActionRunning('characters') ? (creativeWorkspace.startingAction === 'characters' ? '正在启动' : '生成中') : '生成人物关系'"></span></button><button class="btn btn-outline-light btn-sm" @click="createBlankCharacterBatch"><i class="bi bi-plus-lg me-1"></i>空白版本</button><button class="btn btn-warning btn-sm" @click="completeProjectCharacters" :disabled="!latestCharacterBatchId() || !creativeResourceEditable(currentProjectCharacters()[0])"><i class="bi bi-lock-fill me-1"></i>完成并锁定</button><a class="btn btn-outline-primary btn-sm" x-show="['locked', 'approved'].includes(currentCharacterBatchStatus())" :href="`/writing/projects/${creativeWorkspace.project.id}/outlines`"><i class="bi bi-arrow-right me-1"></i>进入全剧大纲</a><a class="btn btn-outline-secondary btn-sm" x-show="currentGeneratedResourceId('characters')" :href="creativeGeneratedDownloadUrl('characters', 'md')" title="下载当前人物关系"><i class="bi bi-download"></i></a></div></div>
                    <h6>人物卡</h6><table class="table table-sm align-middle mb-3"><thead><tr><th>角色名</th><th>年龄段</th><th>身份</th><th>内在欲望</th><th>秘密</th><th>成长线</th><th>操作</th></tr></thead><tbody><template x-for="item in currentProjectCharacters()" :key="item.id"><tr><td><input class="form-control form-control-sm" x-model="item.content.name" :disabled="!creativeResourceEditable(item)"></td><td><input class="form-control form-control-sm" x-model="item.content.age_range" :disabled="!creativeResourceEditable(item)"></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.identity, 24)" x-model="item.content.identity" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.desire, 24)" x-model="item.content.desire" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.secret, 24)" x-model="item.content.secret" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.growth_arc, 24)" x-model="item.content.growth_arc" :disabled="!creativeResourceEditable(item)"></textarea></td><td><button class="btn btn-sm btn-outline-light" @click="saveProjectCharacter(item)" :disabled="!creativeResourceEditable(item) || creativeWorkspace.saveState['character-' + item.id] === 'saving'" :title="!creativeResourceEditable(item) ? '人物版本已完成并锁定' : '保存人物卡'" :aria-label="!creativeResourceEditable(item) ? '人物版本已完成并锁定' : '保存人物卡'"><i class="bi bi-save" x-show="creativeWorkspace.saveState['character-' + item.id] !== 'saving' && creativeWorkspace.saveState['character-' + item.id] !== 'saved'"></i><span class="spinner-border spinner-border-sm" x-show="creativeWorkspace.saveState['character-' + item.id] === 'saving'"></span><i class="bi bi-check2 text-success" x-show="creativeWorkspace.saveState['character-' + item.id] === 'saved'"></i></button><small class="creative-save-status" :title="item.updated_at ? `保存时间：${formatDate(item.updated_at)}` : ''" x-text="creativeItemSaveLabel(item, 'character-' + item.id)"></small></td></tr></template><tr x-show="!currentProjectCharacters().length"><td colspan="7" class="text-center text-muted py-4">暂无人物卡</td></tr></tbody></table>
                    <h6 class="small text-muted">可行动人物设置</h6><table class="table table-sm align-middle mb-4"><thead><tr><th>角色名</th><th>行动目标</th><th>最怕失去</th><th>行为矛盾</th><th>压力反应</th><th>底线</th><th>操作</th></tr></thead><tbody><template x-for="item in currentProjectCharacters()" :key="`action-${item.id}`"><tr><td class="fw-semibold" x-text="item.content.name"></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.action_goal, 24)" x-model="item.content.action_goal" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.fear_of_loss, 24)" x-model="item.content.fear_of_loss" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.behavioral_contradiction, 24)" x-model="item.content.behavioral_contradiction" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.pressure_response, 24)" x-model="item.content.pressure_response" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.bottom_line, 24)" x-model="item.content.bottom_line" :disabled="!creativeResourceEditable(item)"></textarea></td><td><button class="btn btn-sm btn-outline-light" @click="saveProjectCharacter(item)" :disabled="!creativeResourceEditable(item) || creativeWorkspace.saveState['character-' + item.id] === 'saving'" title="保存可行动人物设置" aria-label="保存可行动人物设置"><i class="bi bi-save"></i></button></td></tr></template></tbody></table>
                    <h6 class="small text-muted">角色表现设置</h6><table class="table table-sm align-middle mb-4"><thead><tr><th>角色名</th><th>外在标签</th><th>台词风格</th><th>造型 Prompt</th><th>声音 Prompt</th><th>操作</th></tr></thead><tbody><template x-for="item in currentProjectCharacters()" :key="`style-${item.id}`"><tr><td class="fw-semibold" x-text="item.content.name"></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(listText(item.content.external_tags), 28)" :value="listText(item.content.external_tags)" @input="setListField(item.content, 'external_tags', $event.target.value)" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.dialogue_style, 28)" x-model="item.content.dialogue_style" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.appearance_prompt, 28)" x-model="item.content.appearance_prompt" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.voice_prompt, 28)" x-model="item.content.voice_prompt" :disabled="!creativeResourceEditable(item)"></textarea></td><td><button class="btn btn-sm btn-outline-light" @click="saveProjectCharacter(item)" :disabled="!creativeResourceEditable(item) || creativeWorkspace.saveState['character-' + item.id] === 'saving'" :title="!creativeResourceEditable(item) ? '人物版本已完成并锁定' : '保存角色表现设置'" :aria-label="!creativeResourceEditable(item) ? '人物版本已完成并锁定' : '保存角色表现设置'"><i class="bi bi-save" x-show="creativeWorkspace.saveState['character-' + item.id] !== 'saving' && creativeWorkspace.saveState['character-' + item.id] !== 'saved'"></i><span class="spinner-border spinner-border-sm" x-show="creativeWorkspace.saveState['character-' + item.id] === 'saving'"></span><i class="bi bi-check2 text-success" x-show="creativeWorkspace.saveState['character-' + item.id] === 'saved'"></i></button><small class="creative-save-status" :title="item.updated_at ? `保存时间：${formatDate(item.updated_at)}` : ''" x-text="creativeItemSaveLabel(item, 'character-' + item.id)"></small></td></tr></template></tbody></table>
                    <h6>人物关系</h6><table class="table table-sm align-middle"><thead><tr><th>角色 A</th><th>角色 B</th><th>关系</th><th>冲突</th><th>变化弧线</th><th>操作</th></tr></thead><tbody><template x-for="item in currentProjectRelationships()" :key="item.id"><tr><td><input class="form-control form-control-sm" x-model="item.content.from" :disabled="!creativeResourceEditable(item)"></td><td><input class="form-control form-control-sm" x-model="item.content.to" :disabled="!creativeResourceEditable(item)"></td><td><input class="form-control form-control-sm" x-model="item.content.relation" :disabled="!creativeResourceEditable(item)"></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.conflict, 28)" x-model="item.content.conflict" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(item.content.change_arc, 28)" x-model="item.content.change_arc" :disabled="!creativeResourceEditable(item)"></textarea></td><td><button class="btn btn-sm btn-outline-light" @click="saveProjectRelationship(item)" :disabled="!creativeResourceEditable(item) || creativeWorkspace.saveState['relationship-' + item.id] === 'saving'" :title="!creativeResourceEditable(item) ? '人物版本已完成并锁定' : '保存人物关系'" :aria-label="!creativeResourceEditable(item) ? '人物版本已完成并锁定' : '保存人物关系'"><i class="bi bi-save" x-show="creativeWorkspace.saveState['relationship-' + item.id] !== 'saving' && creativeWorkspace.saveState['relationship-' + item.id] !== 'saved'"></i><span class="spinner-border spinner-border-sm" x-show="creativeWorkspace.saveState['relationship-' + item.id] === 'saving'"></span><i class="bi bi-check2 text-success" x-show="creativeWorkspace.saveState['relationship-' + item.id] === 'saved'"></i></button><small class="creative-save-status" :title="item.updated_at ? `保存时间：${formatDate(item.updated_at)}` : ''" x-text="creativeItemSaveLabel(item, 'relationship-' + item.id)"></small></td></tr></template><tr x-show="!currentProjectRelationships().length"><td colspan="6" class="text-center text-muted py-4">暂无人物关系</td></tr></tbody></table>
