<div>
<template x-if="creativeWorkspace.project?.creation_mode === 'original'"><div class="original-brief-workspace">
    <div class="d-flex justify-content-between align-items-end gap-3 mb-3 original-direction-toolbar">
        <div><h5 class="mb-1">原创方向与 Brief</h5><div class="small text-muted">从冻结的灵感版本发散；市场参考只提供安全的市场信号。</div></div>
        <div class="d-flex gap-2 align-items-end original-direction-actions"><div><label class="form-label small">目标方向数</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.directionCount"><option :value="3">3</option><option :value="4">4</option><option :value="5">5</option></select></div><button class="btn btn-primary btn-sm" @click="generateProjectBlueprints" :disabled="creativeActionDisabled('blueprints')"><i class="bi bi-stars me-1"></i><span x-text="latestProjectBlueprints().length ? '补足方向' : '生成原创方向'"></span></button></div>
    </div>
    <div class="original-seed-editor mb-3" x-show="creativeWorkspace.project?.seed"><label class="form-label small">当前灵感版本 <span class="text-muted" x-text="`v${creativeWorkspace.project.seed.version} · ${creativeWorkspace.project.seed.status === 'frozen' ? '已冻结' : '草稿'}`"></span></label><div class="input-group"><textarea class="form-control form-control-sm" rows="2" maxlength="500" x-model="creativeWorkspace.project.seed.seed_text"></textarea><button class="btn btn-outline-light" type="button" @click="saveOriginalSeed" title="冻结版本会另存为新版本"><i class="bi bi-save"></i></button></div></div>
    <div class="table-responsive original-direction-grid"><table class="table table-sm align-middle"><thead><tr><th>保留</th><th>方向</th><th>核心命题</th><th>主角</th><th>核心冲突</th><th>差异化卖点</th><th>成本</th><th>创作风险</th><th>操作</th></tr></thead><tbody><template x-for="item in latestProjectBlueprints()" :key="item.id"><tr :class="{'table-active': creativeWorkspace.selectedBlueprintId === item.id}"><td data-label="保留"><input class="form-check-input" type="checkbox" :checked="creativeWorkspace.preservedBlueprintIds.includes(item.id)" :disabled="item.status !== 'draft'" @change="togglePreservedBlueprint(item.id, $event.target.checked)" :aria-label="`保留${item.content.title || '方向'}`"></td><td data-label="方向" class="fw-semibold" x-text="item.content.title || '未命名方向'"></td><td data-label="核心命题" x-text="item.content.theme || '-'"></td><td data-label="主角" x-text="item.content.protagonist || '-'"></td><td data-label="核心冲突" x-text="item.content.core_conflict || '-'"></td><td data-label="差异化卖点" x-text="listText(item.content.differentiators) || '-'"></td><td data-label="成本" x-text="item.content.cost_level || '-'"></td><td data-label="创作风险" x-text="listText(item.content.risks) || '-'"></td><td data-label="操作"><button class="btn btn-sm btn-outline-light" @click="creativeWorkspace.selectedBlueprintId = item.id">编辑</button></td></tr></template><tr x-show="!latestProjectBlueprints().length"><td colspan="9" class="text-center text-muted py-4">尚未生成原创方向</td></tr></tbody></table></div>
    <template x-if="selectedProjectBlueprint()"><div class="border-top pt-3 original-direction-editor">
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label small">方向名称</label><input class="form-control form-control-sm" x-model="selectedProjectBlueprint().content.title" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
            <div class="col-md-4"><label class="form-label small">主角</label><textarea class="form-control form-control-sm" rows="2" x-model="selectedProjectBlueprint().content.protagonist" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-4"><label class="form-label small">核心冲突</label><textarea class="form-control form-control-sm" rows="2" x-model="selectedProjectBlueprint().content.core_conflict" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-6"><label class="form-label small">一句话梗概</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.logline" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-6"><label class="form-label small">核心命题</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.theme" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-6"><label class="form-label small">故事发动机</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.story_engine" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-6"><label class="form-label small">差异化卖点</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.differentiators)" @input="setListField(selectedProjectBlueprint().content, 'differentiators', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-12"><label class="form-label small">原创性说明</label><textarea class="form-control form-control-sm" rows="2" x-model="selectedProjectBlueprint().content.originality_statement" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-4"><label class="form-label small">创作风险</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.risks)" @input="setListField(selectedProjectBlueprint().content, 'risks', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-4"><label class="form-label small">当前假设</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.assumptions)" @input="setListField(selectedProjectBlueprint().content, 'assumptions', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
            <div class="col-md-4"><label class="form-label small">待确认问题</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.open_questions)" @input="setListField(selectedProjectBlueprint().content, 'open_questions', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
        </div>
        <div class="d-flex gap-2 mt-3 original-direction-actions"><button class="btn btn-outline-light btn-sm" @click="saveProjectBlueprint" :disabled="!creativeResourceEditable(selectedProjectBlueprint())">保存草稿</button><button class="btn btn-warning btn-sm" @click="completeProjectBrief" :disabled="!creativeResourceEditable(selectedProjectBlueprint())">完成并锁定</button><input class="form-control form-control-sm variant-instruction" maxlength="500" x-model="creativeWorkspace.variantInstruction" placeholder="填写派生要求，如：改成悬疑类型"><button class="btn btn-outline-info btn-sm" @click="deriveOriginalDirection" :disabled="!creativeWorkspace.variantInstruction.trim()">派生方向</button></div>
    </div>
    </template>
</div>
</template>
<template x-if="creativeWorkspace.project?.creation_mode !== 'original'"><div class="imitation-brief-workspace">
                    <div class="d-flex justify-content-between align-items-end mb-3"><div><template x-if="creativeWorkspace.project?.creation_mode !== 'original'"><h5 class="mb-1">仿制方向与 Brief</h5></template><div class="small text-muted">只借鉴结构和爽点，不复制剧情、人设、台词或具体表达</div></div><div class="d-flex gap-2 align-items-end"><div><label class="form-label small">方向数量</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.directionCount"><option :value="3">3</option><option :value="4">4</option><option :value="5">5</option></select></div><button class="btn btn-primary btn-sm" @click="generateProjectBlueprints" :disabled="creativeActionDisabled('blueprints')"><span class="spinner-border spinner-border-sm me-1" x-show="creativeActionRunning('blueprints')"></span><i class="bi bi-stars me-1" x-show="!creativeActionRunning('blueprints')"></i><span x-text="creativeActionRunning('blueprints') ? (creativeWorkspace.startingAction === 'blueprints' ? '正在启动' : '生成中') : '生成方向'"></span></button></div></div>
                    <table class="table table-sm table-hover align-middle mb-3"><thead><tr><th>方向</th><th>仿制原因</th><th>主角</th><th>核心冲突</th><th>背景</th><th>成本</th><th>风险</th><th>版本</th><th>操作</th></tr></thead><tbody><template x-for="item in latestProjectBlueprints()" :key="item.id"><tr :class="{'table-active': creativeWorkspace.selectedBlueprintId === item.id}"><td class="fw-semibold" x-text="item.content.title || '未命名方向'"></td><td class="blueprint-conflict-cell" style="overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;" :title="imitationReason(item.content)"><span x-text="imitationReason(item.content)"></span></td><td x-text="item.content.protagonist || '-'"></td><td class="blueprint-conflict-cell" style="overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;" :title="item.content.core_conflict || '-'"><span x-text="item.content.core_conflict || '-'"></span></td><td x-text="item.content.background || '-'"></td><td x-text="item.content.cost_level || '-'"></td><td><span class="badge" :class="riskBadgeClass(item.risk_level)" x-text="`${riskLabel(item.risk_level)} ${Number(item.risk_score || 0).toFixed(0)}`"></span></td><td x-text="`v${item.version} · ${creativeWorkflowStatusLabel(item.status)}`"></td><td><button class="btn btn-sm btn-outline-light" @click="creativeWorkspace.selectedBlueprintId = item.id"><i class="bi bi-pencil"></i></button></td></tr></template><tr x-show="!latestProjectBlueprints().length"><td colspan="9" class="text-center text-muted py-4">尚未生成仿制方向</td></tr></tbody></table>
                    <template x-if="selectedProjectBlueprint()"><div class="border-top pt-3">
                        <div class="row g-2 align-items-end border-bottom pb-3 mb-3">
                            <div class="col-md-3"><label class="form-label small">项目名称</label><input class="form-control form-control-sm" x-model="creativeWorkspace.project.name" :disabled="true"></div>
                            <div class="col-md-2"><label class="form-label small">题材</label><input class="form-control form-control-sm" x-model="creativeWorkspace.project.genre" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
                            <div class="col-md-2"><label class="form-label small">目标平台</label><select class="form-select form-select-sm" x-model="creativeWorkspace.project.target_platform" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"><option value="">待定</option><option value="dy">抖音</option><option value="hg">红果</option></select></div>
                            <div class="col-md-2"><label class="form-label small">目标受众</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(creativeWorkspace.project.target_audience, 16)" x-model="creativeWorkspace.project.target_audience" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-1"><label class="form-label small">集数</label><input class="form-control form-control-sm" type="number" min="1" max="100" x-model.number="creativeWorkspace.project.target_episode_count" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
                            <div class="col-md-1"><label class="form-label small">秒/集</label><input class="form-control form-control-sm" type="number" min="30" max="1800" x-model.number="creativeWorkspace.project.episode_duration_seconds" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></div>
                            <div class="col-md-1 d-grid"><button class="btn btn-outline-light btn-sm" @click="saveCreativeProjectSettings" :disabled="!creativeResourceEditable(selectedProjectBlueprint())" title="保存 Brief 参数"><i class="bi bi-save"></i></button></div>
                        </div>
                        <div class="alert alert-info py-2 small mb-3" x-show="!creativeResourceEditable(selectedProjectBlueprint())" role="status">
                            <i class="bi bi-lock me-1" aria-hidden="true"></i>此版本已锁定，不可编辑。如需修改请创建新版本。
                        </div>
                        <div class="row g-3">
                            <div class="col-md-3"><label class="form-label small">方向名称</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.selectedBlueprintId"><template x-for="item in latestProjectBlueprints()" :key="`direction-${item.id}`"><option :value="item.id" x-text="item.content.title || `方向 v${item.version}`"></option></template></select></div>
                            <div class="col-md-3"><label class="form-label small">新主角</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(selectedProjectBlueprint().content.protagonist, 24)" x-model="selectedProjectBlueprint().content.protagonist" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-3"><label class="form-label small">新背景</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(selectedProjectBlueprint().content.background, 24)" x-model="selectedProjectBlueprint().content.background" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-3"><label class="form-label small">方向目标受众</label><textarea class="form-control form-control-sm creative-inline-textarea" :rows="textareaRows(selectedProjectBlueprint().content.audience, 24)" x-model="selectedProjectBlueprint().content.audience" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-12"><label class="form-label small">仿制原因</label><textarea class="form-control form-control-sm" :rows="textareaRows(imitationReason(selectedProjectBlueprint().content), 70)" :value="imitationReason(selectedProjectBlueprint().content)" @input="setImitationReason(selectedProjectBlueprint().content, $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-4"><label class="form-label small">核心冲突</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.core_conflict" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-4"><label class="form-label small">主线目标</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.main_goal" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-4"><label class="form-label small">世界观</label><textarea class="form-control form-control-sm" rows="3" x-model="selectedProjectBlueprint().content.worldview" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">借鉴元素</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.borrowed_elements)" @input="setListField(selectedProjectBlueprint().content, 'borrowed_elements', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">必须差异化元素</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.different_elements)" @input="setListField(selectedProjectBlueprint().content, 'different_elements', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">前三集钩子</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.first_three_hooks)" @input="setListField(selectedProjectBlueprint().content, 'first_three_hooks', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-md-6"><label class="form-label small">整体爽点</label><textarea class="form-control form-control-sm" rows="3" :value="listText(selectedProjectBlueprint().content.highlights)" @input="setListField(selectedProjectBlueprint().content, 'highlights', $event.target.value)" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                            <div class="col-12"><label class="form-label small">差异化修改说明 <span class="text-warning" x-show="selectedProjectBlueprint().risk_level === 'high'">高风险方向完成锁定前必填</span></label><textarea class="form-control form-control-sm" rows="2" x-model="selectedProjectBlueprint().difference_note" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"></textarea></div>
                        </div>
                        <div class="d-flex gap-2 mt-3"><button class="btn btn-outline-light btn-sm" @click="saveProjectBlueprint" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"><i class="bi bi-save me-1"></i>保存草稿</button><button class="btn btn-warning btn-sm" @click="completeProjectBrief" :disabled="!creativeResourceEditable(selectedProjectBlueprint())"><i class="bi bi-lock-fill me-1"></i>完成并锁定</button><button class="btn btn-outline-info btn-sm" x-show="selectedProjectBlueprint().status === 'brief_locked' || selectedProjectBlueprint().status === 'locked'" @click="createProjectBlueprintVersion"><i class="bi bi-files me-1"></i>基于此版本新建</button><span class="small text-muted">草稿 · 已完成 · 已替代</span><a class="btn btn-outline-secondary btn-sm" x-show="currentGeneratedResourceId('brief')" :href="creativeGeneratedDownloadUrl('brief', 'md')"><i class="bi bi-download me-1"></i>导出</a></div>
                    </div></template>
                </div>
</template>
</div>
