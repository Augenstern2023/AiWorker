<div class="outline-workspace workspace-stage-editor workspace-stage-editor--outlines" x-effect="syncOutlineEpisodeCardContext(creativeWorkspace.project)">
    <div class="d-flex justify-content-between align-items-center mb-3 outline-section-heading">
        <div><h5 class="mb-1">分集大纲 <span class="badge text-bg-secondary" x-text="creativeWorkflowStatusLabel(currentOutlineBatchStatus())"></span></h5><div class="small text-muted" x-text="isFreeCreativeProject() ? '始终按全剧创建；不要求已有 Brief 或人物。' : '先规划全剧阶段弧线；完成并锁定后可生成单集 Beats'"></div></div>
        <div class="d-flex gap-2 outline-primary-actions"><a class="btn btn-outline-info btn-sm" x-show="!isFreeCreativeProject() && projectHasGeneratedScripts()" :href="mergedScriptDownloadUrl()" title="合并下载已生成场次剧本"><i class="bi bi-download me-1"></i>剧本下载</a><button class="btn btn-primary btn-sm" @click="generateProjectOutlines" :disabled="creativeActionDisabled('outlines')"><span class="spinner-border spinner-border-sm me-1" x-show="creativeActionRunning('outlines')"></span><i class="bi bi-list-ol me-1" x-show="!creativeActionRunning('outlines')"></i><span x-text="creativeActionRunning('outlines') ? (creativeWorkspace.startingAction === 'outlines' ? '正在启动' : '生成中') : outlineGenerationActionLabel()"></span></button><button class="btn btn-outline-light btn-sm" x-show="isFreeCreativeProject()" @click="createFreeBlankResource('outline')" :disabled="!freeStageCan('outline', 'can_create_blank')"><i class="bi bi-plus-lg me-1"></i>空白全剧版本</button><button class="btn btn-warning btn-sm" x-show="currentProjectOutlines().length && creativeResourceEditable(currentProjectOutlines()[0])" @click="completeProjectOutlines" :disabled="!(currentProjectOutlines().length === Number(creativeWorkspace.project.target_episode_count || 0)) || !latestOutlineBatchId() || !creativeResourceEditable(currentProjectOutlines()[0])"><i class="bi bi-lock-fill me-1"></i>完成并锁定</button><button class="btn btn-outline-info btn-sm" x-show="isFreeCreativeProject() && ['locked', 'approved'].includes(currentOutlineBatchStatus())" @click="createFreeResourceRevision('outline')" :disabled="!freeStageCan('outline', 'can_create_revision')"><i class="bi bi-files me-1"></i>创建修订版</button><a class="btn btn-outline-secondary btn-sm" x-show="currentGeneratedResourceId('outline')" :href="creativeGeneratedDownloadUrl('outline', 'md')" title="下载完整当前大纲版本"><i class="bi bi-file-earmark-arrow-down"></i></a><button class="btn btn-outline-secondary btn-sm" type="button" x-show="currentProjectOutlines().length" @click="openEpisodeDownload('outline')" title="选择多集或全集下载"><i class="bi bi-download me-1"></i>多集/全集下载</button></div>
    </div>
    <div class="row g-2 align-items-end mb-3" x-show="!isFreeCreativeProject() && availableLockedBriefs().length">
        <div class="col-md-4"><label class="form-label small">创作方向（锁定 Brief）</label><select class="form-select form-select-sm" x-model.number="creativeWorkspace.selectedOutlineBriefId"><template x-for="brief in availableLockedBriefs()" :key="`outline-brief-${brief.id}`"><option :value="brief.id" x-text="`${brief.content.title || '未命名方向'} · v${brief.version}`"></option></template></select></div>
        <div class="col-md-auto"><button class="btn btn-outline-primary btn-sm" @click="selectOutlineBrief" :disabled="Number(creativeWorkspace.selectedOutlineBriefId) === Number(creativeWorkspace.project.locked_brief_id)"><i class="bi bi-arrow-repeat me-1"></i>切换方向</button></div>
        <div class="col-md-5"><label class="form-label small">人物关系版本（已锁定）</label><select class="form-select form-select-sm" x-model="creativeWorkspace.selectedOutlineCharacterBatchId" :disabled="!availableLockedCharacterBatches().length"><option value="" x-show="!availableLockedCharacterBatches().length">暂无与当前创作方向匹配的已锁定人物关系</option><template x-for="batch in availableLockedCharacterBatches()" :key="`outline-character-${batch.batch_id}`"><option :value="batch.batch_id" x-text="`v${batch.version} · ${batch.names.join('、') || '未命名角色'}`"></option></template></select></div>
        <div class="col-md-auto"><button class="btn btn-outline-primary btn-sm" x-show="availableLockedCharacterBatches().length" @click="selectOutlineCharacterBatch" :disabled="String(creativeWorkspace.selectedOutlineCharacterBatchId || '') === String(creativeWorkspace.project.character_batch_id || '')"><i class="bi bi-arrow-repeat me-1"></i>切换版本</button><a class="btn btn-outline-warning btn-sm" x-show="!availableLockedCharacterBatches().length" :href="`/writing/projects/${creativeWorkspace.project.id}/characters`"><i class="bi bi-people me-1"></i>前往人物关系</a></div>
    </div>
    <section class="outline-series-overview" aria-labelledby="outline-series-overview-title">
        <header class="outline-overview-header">
            <div class="outline-overview-heading">
                <h6 class="mb-0" id="outline-series-overview-title">全集剧情概览</h6>
                <span class="small text-muted" x-show="currentProjectOutlines().length" x-text="`随当前大纲 v${currentProjectOutlines()[0]?.version || 1} 保存`"></span>
                <span class="outline-overview-error-summary" role="alert" x-show="!creativeWorkspace.outlineOverviewExpanded && outlineOverviewErrorSummary()" x-text="outlineOverviewErrorSummary()"></span>
            </div>
            <div class="outline-overview-actions">
                <button class="btn btn-outline-primary btn-sm" type="button" x-show="outlineOverviewGenerationReady() && !outlineSeriesOverviewExists() && outlineOverviewGenerationAllowed()" @click="generateOutlineSeriesOverview" :disabled="creativeActionDisabled('outline_overview')" aria-label="生成全集剧情概览">
                    <span class="spinner-border spinner-border-sm me-1" x-show="creativeActionRunning('outline_overview')" aria-hidden="true"></span><i class="bi bi-stars me-1" x-show="!creativeActionRunning('outline_overview')" aria-hidden="true"></i><span x-text="creativeActionRunning('outline_overview') ? '生成中' : '生成概览'"></span>
                </button>
                <button class="btn btn-primary btn-sm" type="button" x-show="outlineSeriesOverviewExists() && outlineOverviewEditable()" @click="saveOutlineSeriesOverview" :disabled="creativeWorkspace.outlineOverviewSaving || !outlineSeriesOverviewDirty()" aria-label="保存全集剧情概览">
                    <span class="spinner-border spinner-border-sm me-1" x-show="creativeWorkspace.outlineOverviewSaving" aria-hidden="true"></span><i class="bi bi-save me-1" x-show="!creativeWorkspace.outlineOverviewSaving" aria-hidden="true"></i><span x-text="creativeWorkspace.outlineOverviewSaving ? '保存中' : '保存概览'"></span>
                </button>
                <button class="btn btn-outline-secondary btn-sm outline-overview-toggle" type="button" @click="toggleOutlineSeriesOverview" :aria-expanded="creativeWorkspace.outlineOverviewExpanded ? 'true' : 'false'" :aria-label="creativeWorkspace.outlineOverviewExpanded ? '收起全集剧情概览' : '展开全集剧情概览'">
                    <i class="bi bi-chevron-up" :class="{'is-collapsed': !creativeWorkspace.outlineOverviewExpanded}" aria-hidden="true"></i><span x-text="creativeWorkspace.outlineOverviewExpanded ? '收起' : '展开'"></span>
                </button>
            </div>
        </header>
        <div class="outline-overview-body" x-show="creativeWorkspace.outlineOverviewExpanded" x-transition.opacity.duration.120ms x-cloak>
            <div class="outline-overview-empty" x-show="!currentProjectOutlines().length">生成分集大纲后将自动形成全集概览</div>
            <div class="outline-overview-empty" x-show="currentProjectOutlines().length && !outlineSeriesOverviewExists()">
                <span x-show="outlineOverviewEditable() && outlineOverviewGenerationReady()">当前大纲版本尚无结构化概览，可基于全部分集内容补充生成。</span>
                <span x-show="!outlineOverviewEditable() && outlineOverviewGenerationAllowed() && outlineOverviewGenerationReady()">当前大纲版本已锁定，可基于全部分集内容补充生成。</span>
                <span x-show="outlineOverviewGenerationAllowed() && !outlineOverviewGenerationReady()">当前分集大纲尚未完整生成，完成全部分集后可生成全集概览。</span>
                <span x-show="!outlineOverviewGenerationAllowed()">当前大纲版本不可补充生成结构化全集概览。</span>
            </div>
            <div class="outline-overview-grid" x-show="outlineSeriesOverviewExists()">
                <div class="outline-overview-field"><label class="outline-overview-field-label" for="outline-overview-core-event">核心事件</label><textarea class="form-control form-control-sm outline-overview-textarea workspace-prose-editor" id="outline-overview-core-event" rows="4" x-model="creativeWorkspace.outlineOverviewDraft.core_event" @input="clearOutlineOverviewError('core_event')" :disabled="!outlineOverviewEditable()"></textarea><div class="outline-overview-error" x-show="creativeWorkspace.outlineOverviewErrors.core_event" x-text="creativeWorkspace.outlineOverviewErrors.core_event" role="alert"></div></div>
                <div class="outline-overview-field"><label class="outline-overview-field-label" for="outline-overview-character-progress">人物推进</label><textarea class="form-control form-control-sm outline-overview-textarea" id="outline-overview-character-progress" rows="4" x-model="creativeWorkspace.outlineOverviewDraft.character_progress" @input="clearOutlineOverviewError('character_progress')" :disabled="!outlineOverviewEditable()"></textarea><div class="outline-overview-error" x-show="creativeWorkspace.outlineOverviewErrors.character_progress" x-text="creativeWorkspace.outlineOverviewErrors.character_progress" role="alert"></div></div>
                <div class="outline-overview-field"><label class="outline-overview-field-label" for="outline-overview-conflict">主要冲突</label><textarea class="form-control form-control-sm outline-overview-textarea" id="outline-overview-conflict" rows="4" x-model="creativeWorkspace.outlineOverviewDraft.conflict" @input="clearOutlineOverviewError('conflict')" :disabled="!outlineOverviewEditable()"></textarea><div class="outline-overview-error" x-show="creativeWorkspace.outlineOverviewErrors.conflict" x-text="creativeWorkspace.outlineOverviewErrors.conflict" role="alert"></div></div>
                <div class="outline-overview-field"><label class="outline-overview-field-label" for="outline-overview-reversal">关键反转</label><textarea class="form-control form-control-sm outline-overview-textarea" id="outline-overview-reversal" rows="4" x-model="creativeWorkspace.outlineOverviewDraft.reversal" @input="clearOutlineOverviewError('reversal')" :disabled="!outlineOverviewEditable()"></textarea><div class="outline-overview-error" x-show="creativeWorkspace.outlineOverviewErrors.reversal" x-text="creativeWorkspace.outlineOverviewErrors.reversal" role="alert"></div></div>
                <div class="outline-overview-field"><label class="outline-overview-field-label" for="outline-overview-highlight">剧情亮点</label><textarea class="form-control form-control-sm outline-overview-textarea" id="outline-overview-highlight" rows="4" x-model="creativeWorkspace.outlineOverviewDraft.highlight" @input="clearOutlineOverviewError('highlight')" :disabled="!outlineOverviewEditable()"></textarea><div class="outline-overview-error" x-show="creativeWorkspace.outlineOverviewErrors.highlight" x-text="creativeWorkspace.outlineOverviewErrors.highlight" role="alert"></div></div>
                <div class="outline-overview-field"><label class="outline-overview-field-label" for="outline-overview-cliffhanger">结尾悬念</label><textarea class="form-control form-control-sm outline-overview-textarea" id="outline-overview-cliffhanger" rows="4" x-model="creativeWorkspace.outlineOverviewDraft.cliffhanger" @input="clearOutlineOverviewError('cliffhanger')" :disabled="!outlineOverviewEditable()"></textarea><div class="outline-overview-error" x-show="creativeWorkspace.outlineOverviewErrors.cliffhanger" x-text="creativeWorkspace.outlineOverviewErrors.cliffhanger" role="alert"></div></div>
            </div>
        </div>
    </section>
    <div class="outline-list-toolbar" aria-label="分集大纲列表工具栏">
        <div class="outline-search-wrap">
            <label class="visually-hidden" for="outline-episode-search">搜索集数或核心事件</label>
            <i class="bi bi-search outline-search-icon" aria-hidden="true"></i>
            <input class="form-control form-control-sm outline-search-input" id="outline-episode-search" type="search" x-model="creativeWorkspace.outlineQuery" placeholder="搜索集数或核心事件" autocomplete="off" :disabled="!currentProjectOutlines().length">
            <span class="outline-search-count" x-show="creativeWorkspace.outlineQuery.trim()" x-text="`${filteredProjectOutlines().length} 集`" aria-live="polite"></span>
        </div>
        <div class="outline-batch-actions">
            <button class="btn btn-outline-secondary btn-sm" id="outline-collapse-all" type="button" @click="collapseAllOutlineEpisodes" :disabled="!filteredProjectOutlines().length"><i class="bi bi-arrows-collapse me-1" aria-hidden="true"></i>全部收起</button>
            <button class="btn btn-outline-primary btn-sm" id="outline-expand-all" type="button" @click="expandAllOutlineEpisodes" :disabled="!filteredProjectOutlines().length"><i class="bi bi-arrows-expand me-1" aria-hidden="true"></i>全部展开</button>
        </div>
    </div>

    <div class="outline-episode-list" x-show="currentProjectOutlines().length">
        <template x-for="item in filteredProjectOutlines()" :key="item.id">
            <article class="outline-episode-card" :class="{'is-expanded': outlineEpisodeExpanded(item.episode_number)}" :data-episode-number="item.episode_number" x-init="item.content = item.content || {}">
                <header class="outline-episode-header">
                    <div class="outline-episode-identity">
                        <span class="outline-episode-number" x-text="`第 ${item.episode_number} 集`"></span>
                        <span class="small text-muted" data-template-provenance x-text="creativeTemplateProvenance(item)"></span>
                        <a class="badge text-bg-success text-decoration-none outline-script-status" x-show="projectEpisodeScript(item.episode_number)" :href="`/writing/projects/${creativeWorkspace.project.id}/episodes/${item.episode_number}/scripts`" @click.stop title="打开场次剧本" x-text="projectEpisodeScriptLabel(item.episode_number)"></a>
                        <button class="badge outline-update-status" type="button" x-show="hasProjectEpisodeUpdates(item.episode_number)" @click.stop="openOutlineEpisodeUpdates(item.episode_number)" title="查看 Beats 与剧本更新记录" aria-label="查看 Beats 与剧本更新记录"><i class="bi bi-clock-history" aria-hidden="true"></i><span x-text="projectEpisodeUpdateSummary(item.episode_number)"></span></button>
                    </div>
                    <button class="outline-episode-toggle" type="button" @click="toggleOutlineEpisode(item.episode_number)" :aria-expanded="outlineEpisodeExpanded(item.episode_number) ? 'true' : 'false'" :aria-controls="`outline-episode-details-${item.id}`" :aria-label="`${outlineEpisodeExpanded(item.episode_number) ? '收起' : '展开'}第 ${item.episode_number} 集`">
                        <span class="outline-event-preview" :title="String(item.content.core_event || '')" x-text="item.content.core_event || '暂无核心事件'"></span>
                        <i class="bi bi-chevron-down outline-toggle-icon" aria-hidden="true"></i>
                    </button>
                    <div class="outline-episode-actions" aria-label="单集操作">
                        <button class="btn btn-sm btn-outline-light outline-save-action" type="button" x-show="creativeResourceEditable(item)" @click="saveProjectEpisode(item)" :disabled="!creativeResourceEditable(item)" title="保存大纲" :aria-label="`保存第 ${item.episode_number} 集大纲`"><i class="bi bi-save" aria-hidden="true"></i></button>
                        <a class="btn btn-sm btn-outline-primary outline-beats-action" :href="`/writing/projects/${creativeWorkspace.project.id}/episodes/${item.episode_number}/beats`" @click.stop title="打开单集节拍表" :aria-label="`打开第 ${item.episode_number} 集 Beats`"><i class="bi bi-arrow-right" aria-hidden="true"></i></a>
                    </div>
                </header>
                <div class="outline-episode-details" :id="`outline-episode-details-${item.id}`" x-show="outlineEpisodeExpanded(item.episode_number)" x-transition.opacity.duration.120ms x-cloak>
                    <div class="outline-field-grid">
                        <div class="outline-field-group"><div class="outline-field-header"><label class="outline-field-label" :for="`outline-core-event-${item.id}`">核心事件</label><button type="button" class="btn btn-link btn-sm outline-field-ai-action" data-outline-ai-field="core_event" x-show="outlineFieldRewriteAllowed(item)" @click="openOutlineFieldRewrite(item, 'core_event', '核心事件')" aria-label="AI 重写核心事件"><i class="bi bi-stars" aria-hidden="true"></i><span>AI 重写</span></button></div><textarea class="form-control form-control-sm outline-field-textarea" :id="`outline-core-event-${item.id}`" rows="4" x-model="item.content.core_event" :disabled="!creativeResourceEditable(item)"></textarea></div>
                        <div class="outline-field-group"><div class="outline-field-header"><label class="outline-field-label" :for="`outline-conflict-${item.id}`">冲突</label><button type="button" class="btn btn-link btn-sm outline-field-ai-action" data-outline-ai-field="conflict" x-show="outlineFieldRewriteAllowed(item)" @click="openOutlineFieldRewrite(item, 'conflict', '冲突')" aria-label="AI 重写冲突"><i class="bi bi-stars" aria-hidden="true"></i><span>AI 重写</span></button></div><textarea class="form-control form-control-sm outline-field-textarea" :id="`outline-conflict-${item.id}`" rows="4" x-model="item.content.conflict" :disabled="!creativeResourceEditable(item)"></textarea></div>
                        <div class="outline-field-group"><div class="outline-field-header"><label class="outline-field-label" :for="`outline-character-progress-${item.id}`">人物推进</label><button type="button" class="btn btn-link btn-sm outline-field-ai-action" data-outline-ai-field="character_progress" x-show="outlineFieldRewriteAllowed(item)" @click="openOutlineFieldRewrite(item, 'character_progress', '人物推进')" aria-label="AI 重写人物推进"><i class="bi bi-stars" aria-hidden="true"></i><span>AI 重写</span></button></div><textarea class="form-control form-control-sm outline-field-textarea" :id="`outline-character-progress-${item.id}`" rows="4" x-model="item.content.character_progress" :disabled="!creativeResourceEditable(item)"></textarea></div>
                        <div class="outline-field-group"><div class="outline-field-header"><label class="outline-field-label" :for="`outline-highlight-${item.id}`">亮点</label><button type="button" class="btn btn-link btn-sm outline-field-ai-action" data-outline-ai-field="highlight" x-show="outlineFieldRewriteAllowed(item)" @click="openOutlineFieldRewrite(item, 'highlight', '亮点')" aria-label="AI 重写亮点"><i class="bi bi-stars" aria-hidden="true"></i><span>AI 重写</span></button></div><textarea class="form-control form-control-sm outline-field-textarea" :id="`outline-highlight-${item.id}`" rows="4" x-model="item.content.highlight" :disabled="!creativeResourceEditable(item)"></textarea></div>
                        <div class="outline-field-group"><div class="outline-field-header"><label class="outline-field-label" :for="`outline-reversal-${item.id}`">反转</label><button type="button" class="btn btn-link btn-sm outline-field-ai-action" data-outline-ai-field="reversal" x-show="outlineFieldRewriteAllowed(item)" @click="openOutlineFieldRewrite(item, 'reversal', '反转')" aria-label="AI 重写反转"><i class="bi bi-stars" aria-hidden="true"></i><span>AI 重写</span></button></div><textarea class="form-control form-control-sm outline-field-textarea" :id="`outline-reversal-${item.id}`" rows="4" x-model="item.content.reversal" :disabled="!creativeResourceEditable(item)"></textarea></div>
                        <div class="outline-field-group"><div class="outline-field-header"><label class="outline-field-label" :for="`outline-cliffhanger-${item.id}`">结尾悬念</label><button type="button" class="btn btn-link btn-sm outline-field-ai-action" data-outline-ai-field="cliffhanger" x-show="outlineFieldRewriteAllowed(item)" @click="openOutlineFieldRewrite(item, 'cliffhanger', '结尾悬念')" aria-label="AI 重写结尾悬念"><i class="bi bi-stars" aria-hidden="true"></i><span>AI 重写</span></button></div><textarea class="form-control form-control-sm outline-field-textarea workspace-prose-editor" :id="`outline-cliffhanger-${item.id}`" rows="4" x-model="item.content.cliffhanger" :disabled="!creativeResourceEditable(item)"></textarea></div>
                    </div>
                </div>
            </article>
        </template>
    </div>
    <div class="outline-empty-state" x-show="!currentProjectOutlines().length">暂无分集大纲</div>
    <div class="outline-empty-state" x-show="currentProjectOutlines().length && !filteredProjectOutlines().length">未找到匹配的分集大纲</div>
</div>
