<div>
                    <div class="d-flex justify-content-between align-items-center mb-3"><div><h5 class="mb-1">分集大纲 <span class="badge text-bg-secondary" x-text="creativeWorkflowStatusLabel(currentOutlineBatchStatus())"></span></h5><div class="small text-muted">先规划全剧阶段弧线；完成并锁定后可生成单集 Beats</div></div><div class="d-flex gap-2"><button class="btn btn-primary btn-sm" @click="generateProjectOutlines" :disabled="creativeActionDisabled('outlines')"><span class="spinner-border spinner-border-sm me-1" x-show="creativeActionRunning('outlines')"></span><i class="bi bi-list-ol me-1" x-show="!creativeActionRunning('outlines')"></i><span x-text="creativeActionRunning('outlines') ? (creativeWorkspace.startingAction === 'outlines' ? '正在启动' : '生成中') : '生成大纲'"></span></button><button class="btn btn-warning btn-sm" @click="completeProjectOutlines" :disabled="!latestOutlineBatchId() || !creativeResourceEditable(currentProjectOutlines()[0])"><i class="bi bi-lock-fill me-1"></i>完成并锁定</button><a class="btn btn-outline-secondary btn-sm" :href="creativeExportUrl('outline', 'md')"><i class="bi bi-download"></i></a></div></div>
                    <table class="table table-sm align-middle"><thead><tr><th style="width:105px">集</th><th>核心事件</th><th>冲突</th><th>人物推进</th><th>爽点</th><th>反转</th><th>结尾悬念</th><th style="width:105px">操作</th></tr></thead><tbody><template x-for="item in currentProjectOutlines()" :key="item.id"><tr><td><div class="fw-semibold" x-text="item.episode_number"></div><a class="badge text-bg-success text-decoration-none mt-1" x-show="projectEpisodeScript(item.episode_number)" :href="`/writing/projects/${creativeWorkspace.project.id}/episodes/${item.episode_number}/scripts`" title="打开场次剧本" x-text="projectEpisodeScriptLabel(item.episode_number)"></a></td><td><textarea class="form-control form-control-sm" rows="2" x-model="item.content.core_event" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm" rows="2" x-model="item.content.conflict" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm" rows="2" x-model="item.content.character_progress" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm" rows="2" x-model="item.content.highlight" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm" rows="2" x-model="item.content.reversal" :disabled="!creativeResourceEditable(item)"></textarea></td><td><textarea class="form-control form-control-sm" rows="2" x-model="item.content.cliffhanger" :disabled="!creativeResourceEditable(item)"></textarea></td><td><div class="d-flex gap-1"><button class="btn btn-sm btn-outline-light" @click="saveProjectEpisode(item)" :disabled="!creativeResourceEditable(item)" title="保存大纲"><i class="bi bi-save"></i></button><a class="btn btn-sm btn-outline-primary" :href="`/writing/projects/${creativeWorkspace.project.id}/episodes/${item.episode_number}/beats`" title="打开单集节拍表"><i class="bi bi-arrow-right"></i></a></div></td></tr></template><tr x-show="!currentProjectOutlines().length"><td colspan="8" class="text-center text-muted py-4">暂无分集大纲</td></tr></tbody></table>
                </div>
