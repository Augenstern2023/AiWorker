{% extends "layouts/base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <div><h3 class="mb-1">成果交付</h3><div class="small text-muted">直接下载项目已生成成果；正式交付才会创建可审计快照</div></div>
  <button class="btn btn-outline-secondary btn-sm" id="refresh-deliveries" title="刷新"><i class="bi bi-arrow-clockwise"></i></button>
</div>
<form id="delivery-create-form" class="row g-2 align-items-end mb-4">
  <div class="col-12 col-lg-6">
    <label class="form-label" for="delivery-submission">已生成成果</label>
    <select class="form-select" id="delivery-submission" required><option value="">正在加载成果...</option></select>
  </div>
  <div class="col-5 col-lg-2">
    <label class="form-label" for="delivery-format">格式</label>
    <select class="form-select" id="delivery-format"><option value="md">Markdown</option><option value="txt">TXT</option><option value="json">JSON</option></select>
  </div>
  <div class="col-7 col-lg-4 d-flex gap-2">
    <button class="btn btn-primary flex-grow-1" id="delivery-download" type="button" disabled><i class="bi bi-download me-1"></i>下载</button>
    <button class="btn btn-outline-warning flex-grow-1" id="delivery-formalize" type="submit" disabled><i class="bi bi-journal-check me-1"></i>正式交付</button>
  </div>
</form>
<div class="table-responsive">
  <table class="table table-sm align-middle">
    <thead><tr><th>时间</th><th>项目</th><th>阶段</th><th>版本</th><th>类型</th><th>格式</th><th>指纹</th><th></th></tr></thead>
    <tbody id="delivery-history"><tr><td colspan="8" class="text-center text-muted py-4">正在加载交付记录...</td></tr></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/admin/deliveries.js"></script>{% endblock %}
